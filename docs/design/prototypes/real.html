{ const [jx, jz] = PROV.jing; plume(jx + 12, jz + 3, 5, 0.8); fire(jx + 12, jz + 3, 0.6); if (SHOT === 'battle') { plume(jx - 1, jz + 2, 8, 1.2); fire(jx - 1, jz + 2, 1.2); plume(jx - 17, jz - 4, 4, 0.6); fire(jx - 17, jz - 4, 0.6); } }
