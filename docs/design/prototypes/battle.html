<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battle harness</title>
<!-- Dev harness for src/world/battle.js (docs/design/visual-build.md §5): one siege from data/cities.json at 1 unit = 1 m.
     Serve the repo root and open /docs/design/prototypes/battle.html?city=huai&mode=assault|stand|camp&result=win|loss
     &shot=approach|gate|wall|camp|field|result &tier=high|mid|low &w=&h=&dpr= &measure=1 &trees=0 &labels=0 &play=1
     &atk=<fid> &bo=&ky=&thuy= (attacker troops). The land is a stand-in for nature.js Nature.land(spec) built here round
     the city's real outline (the prototype's SGN.land() is fixed to Thọ Xuân's 420 m square); terrain, water, rocks and
     trees are the prototype's sg-nature.js. -->
<style>html,body{margin:0;background:#1a1712;overflow:hidden;font-family:"Be Vietnam Pro",system-ui,sans-serif}canvas{display:block}
#labels{position:fixed;inset:0;pointer-events:none}
.lb{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:13px;color:#f3ead6;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.lb.city{font-size:16px;font-weight:700;padding:3px 10px;border-radius:4px;background:rgba(30,24,16,.72);border:1px solid rgba(214,188,130,.6)}
.lb.lane{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(150,34,30,.85);color:#fff3e4}
.lb.place{font-style:italic;font-size:14px}
.lb.thing{font-size:12px;color:#e8dcc0}
.lb.camp{font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:4px;background:rgba(30,24,16,.72);border:1px solid rgba(214,188,130,.45)}</style></head><body>
<canvas id="c"></canvas><div id="labels"></div>
<script src="../../../node_modules/three/build/three.min.js"></script>
<script src="../../../node_modules/three/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="../../../node_modules/three/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script src="../../../node_modules/three/examples/js/controls/OrbitControls.js"></script>
<script src="../../../src/world/kit.js"></script>
<script src="../../../src/world/nature.js"></script>
<script src="../../../src/world/han-models.js"></script>
<script src="../../../src/world/crowd.js"></script>
<script src="../../../src/world/battle.js"></script>
<script>
(async () => {
  const T = THREE, q = new URLSearchParams(location.search);
  const TIERS = { high: { dpr: 1.5, shadow: 4096, ssao: true, dof: true }, mid: { dpr: 1, shadow: 2048, ssao: false, dof: true }, low: { dpr: 1, shadow: 0, ssao: false, dof: false } };
  const tier = TIERS[q.get('tier')] ? q.get('tier') : 'high', TQ = TIERS[tier];
  const W = +q.get('w') || innerWidth, H = +q.get('h') || innerHeight, dpr = +q.get('dpr') || TQ.dpr;
  const NAMES = { zhu_yuanzhang: ['Chu Nguyên Chương', '朱'], cao_cao: ['Tào Ngụy', '曹'], liu_bei: ['Lưu Bị', '劉'], sun_quan: ['Tôn Quyền', '孫'], qin_shihuang: ['Tần Thủy Hoàng', '秦'], li_shimin: ['Lý Thế Dân', '唐'], liu_che: ['Hán Vũ Đế', '漢'], local: ['Trung lập', '守'] };
  const cv = document.getElementById('c'); cv.style.width = W + 'px'; cv.style.height = H + 'px';
  try {
    const [cities, world] = await Promise.all([fetch('../../../data/cities.json').then((r) => r.json()), fetch('../../../data/world.json').then((r) => r.json())]);
    const cid = q.get('city') || 'huai', def = { ...cities.cities[cid], id: cid };
    if (!def.outline) throw new Error('no city ' + cid);
    const owner = (world.factions.find((f) => f.start.provinces.includes(cid)) || { id: 'local', color: '#8a7a55' });
    const atkF = world.factions.find((f) => f.id === (q.get('atk') || (owner.id === 'zhu_yuanzhang' ? 'cao_cao' : 'zhu_yuanzhang')));
    const side = (d) => ({ fid: d.id, color: d.color, name: NAMES[d.id][0], glyph: NAMES[d.id][1] });
    const riverSides = (def.river && def.river.sides) || '', atkSide = q.get('side') || ['s', 'e', 'w', 'n'].find((s) => !riverSides.includes(s)) || 's';
    const desc = {
      attacker: { ...side(atkF), troops: { bo: +(q.get('bo') || 12000), ky: +(q.get('ky') || 2000), thuy: +(q.get('thuy') || 500) } },
      defender: { ...side(owner), troops: { bo: 4000, ky: 300, thuy: 0 } },
      city: def, season: 'autumn', hour: 17.5, mode: q.get('mode') || 'assault', result: q.get('result') || undefined, side: atkSide,
    };

    const t0 = performance.now();
    T.ColorManagement.legacyMode = false;
    const renderer = new T.WebGLRenderer({ canvas: cv, antialias: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(dpr); renderer.setSize(W, H, false);
    renderer.outputEncoding = T.sRGBEncoding; renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.92;
    renderer.shadowMap.enabled = !!TQ.shadow; renderer.shadowMap.type = T.PCFSoftShadowMap;
    const scene = new T.Scene(), camera = new T.PerspectiveCamera(40, W / H, 1.5, 16000);
    const sunDir = new T.Vector3(-0.82, 0.36, 0.3).normalize(), sunColor = new T.Color(1.0, 0.72, 0.46);
    const N = window.Nature || window.SGN;

    // the sky of sg-main.js
    const skyMaterial = () => new T.ShaderMaterial({ side: T.BackSide, depthWrite: false, uniforms: { uSun: { value: sunDir } },
      vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
      fragmentShader: `varying vec3 vD; uniform vec3 uSun; ${N.GLSL}
        void main(){ vec3 d = normalize(vD); float h = clamp(d.y, -.1, 1.), s = max(dot(d, normalize(uSun)), 0.);
          vec3 zen = vec3(.1, .2, .42), hor = vec3(.84, .68, .52), warm = vec3(1.2, .58, .26);
          vec3 c = mix(hor, zen, pow(max(h, 0.), .45));
          c = mix(c, warm, pow(s, 2.2) * .85 * (1. - smoothstep(.02, .45, h)));
          c += vec3(1.4, .9, .5) * pow(s, 60.) + vec3(4., 3., 2.) * pow(s, 900.);
          float cl = smoothstep(.55, .8, fbm2(d.xz / max(d.y, .06) * 1.4 + 3.)) * smoothstep(.02, .18, d.y) * (1. - smoothstep(.4, .7, d.y));
          c = mix(c, mix(vec3(.95, .72, .58), vec3(1.1, .75, .45), pow(s, 2.)), cl * .55);
          if (d.y < 0.) c = hor * .8;
          gl_FragColor = vec4(c, 1.); }` });
    const sky = new T.Mesh(new T.SphereGeometry(15000, 48, 24), skyMaterial()); scene.add(sky);
    const es = new T.Scene(); es.add(new T.Mesh(new T.SphereGeometry(100, 32, 16), skyMaterial()));
    const pm = new T.PMREMGenerator(renderer), env = pm.fromScene(es, 0.03).texture; pm.dispose();
    const sun = new T.DirectionalLight(sunColor, 2.35); sun.castShadow = !!TQ.shadow;
    if (TQ.shadow) { sun.shadow.mapSize.set(TQ.shadow, TQ.shadow); sun.shadow.bias = -0.00025; sun.shadow.normalBias = 0.6; }
    scene.add(sun, sun.target, new T.HemisphereLight(new T.Color(0.5, 0.6, 0.8), new T.Color(0.3, 0.24, 0.16), 0.42));

    // the land: Nature.land(spec) when nature.js knows the spec, else the stand-in round the real outline
    const plan = Battle.plan(def);
    const L = window.Nature && Nature.land.length ? Nature.land(Battle.landSpec(desc)) : standInLand(N, def, plan, atkSide);
    const tLand = performance.now();
    const colors = { [atkF.id]: parseInt(atkF.color.slice(1), 16), [owner.id]: parseInt(owner.color.slice(1), 16) };
    const HM = HanModels.create({ recv: (m) => m, renderer, colors });
    const nature = new T.Group(); scene.add(nature);
    const tm = {}, mark = (k, t0) => { tm[k] = Math.round(performance.now() - t0); };
    if (q.get('warm')) { const w0 = performance.now(); N.warm(tier); tm.warm = Math.round(performance.now() - w0); } // &warm=1: the page warmed the cache before this battle
    let t1 = performance.now(); const terrain = N.terrain(L, env, tier); mark('terrain', t1); t1 = performance.now(); const water = N.water(L, env); mark('water', t1); t1 = performance.now(); const rocks = N.rocks(L, env, tier); mark('rocks', t1); nature.add(terrain, water, rocks);
    t1 = performance.now();
    const battle = Battle.siege({ ...desc, ground: L }, { HM, Nature: N, Crowd: q.get('crowd') === 'static' ? null : window.Crowd, env, sun: { dir: sunDir, color: sunColor }, q: tier, renderer, camera });
    scene.add(battle.group); mark('battle', t1);
    let trees = null;
    if (q.get('trees') !== '0') {
      const tops = [];
      rocks.userData.ledges.forEach(([x, yy, z, kind], i) => { const r = N.noise.h2(i, 17); if (kind === 'top') tops.push(r < 0.55 ? [x, z, 3, 7 + r * 9, yy - 0.5] : [x, z, 5, 2 + r * 2, yy - 0.3]); else tops.push(r < 0.3 ? [x, z, 3, 4 + r * 8, yy - 0.8] : [x, z, r < 0.65 ? 5 : 7, 1.6 + r * 1.6, yy - 0.4]); });
      t1 = performance.now(); trees = N.trees(L, env, { dir: sunDir, color: sunColor }, battle.trees.concat(tops), tier); nature.add(trees); mark('trees', t1);
    }
    const tBuild = performance.now();

    // the lens (tier: SSAO, DOF)
    const lens = K.lens(renderer, scene, camera, { focus: 300, range: 300, maxBlur: 3, ao: 0.8, aoRadius: 2, vignette: 0.28, contrast: 1.06, saturation: 1.06,
      atmos: { density: 0.00017, falloff: 0.005, color: 0xa7a8ad, sunColor: 0xe0a070, sunDir } });
    const LU = lens.uniforms, blurK = renderer.getDrawingBufferSize(new T.Vector2()).y / 900; LU.band.value.set(0.5, 0.5);
    const aim = (v) => {
      const tgt = controls ? controls.target : new T.Vector3(...v.target), dist = camera.position.distanceTo(tgt);
      const [sx, sz, ext] = v.shadow || [tgt.x, tgt.z, Math.max(200, dist * 0.8)];
      sun.position.set(sx, 0, sz).addScaledVector(sunDir, 3000); sun.target.position.set(sx, 0, sz); sun.target.updateMatrixWorld();
      Object.assign(sun.shadow.camera, { left: -ext, right: ext, top: ext, bottom: -ext, near: 100, far: 6000 }); sun.shadow.camera.updateProjectionMatrix();
      LU.focus.value = dist; LU.range.value = Math.max(120, dist * 1.2); LU.maxBlur.value = TQ.dof ? 2.6 * blurK : 0;
      LU.aoStrength.value = TQ.ssao ? 0.85 : 0; LU.aoRadius.value = v.ao || Math.max(1.5, dist * 0.006);
      LU.near.value = camera.near; LU.far.value = camera.far;
      LU.projScale.value = renderer.getDrawingBufferSize(new T.Vector2()).y / (2 * Math.tan(T.MathUtils.degToRad(camera.fov) / 2));
      sky.position.copy(camera.position);
    };
    let controls = null;
    const shot = battle.views[q.get('shot')] ? q.get('shot') : 'gate';
    const setView = (v) => {
      camera.fov = v.fov; camera.aspect = W / H; camera.position.set(...v.cam); camera.lookAt(...v.target); camera.updateProjectionMatrix(); camera.updateMatrixWorld();
      if (controls) { controls.target.set(...v.target); controls.update(); }
      aim(v); if (trees) trees.userData.focus(camera); rocks.userData.focus(camera); battle.focus(camera); // the camera, not its position: nature culls shadow casters by the view
    };
    if (q.get('play') && T.OrbitControls) { controls = new T.OrbitControls(camera, cv); controls.enableDamping = true; controls.maxPolarAngle = 1.45; controls.addEventListener('change', () => aim({ ...battle.views[shot], shadow: null })); }
    if (q.get('near')) { // &near=main|attack: a close look at that gate from outside (for checking the gate houses and the khuyết)
      const G = battle.city[q.get('near') === 'main' ? 'mainGate' : 'attackGate'], d = +(q.get('dist') || 90);
      setView({ cam: [G.x + G.out[0] * d - G.tan[0] * d * 0.5, G.y0 + d * 0.3, G.z + G.out[1] * d - G.tan[1] * d * 0.5], target: [G.x, G.y0 + 8, G.z], fov: 45, shadow: [G.x, G.z, 150], ao: 1.2 });
    } else if (q.get('cam')) { const c = q.get('cam').split(',').map(Number), t = q.get('tgt').split(',').map(Number); setView({ cam: c, target: t, fov: +(q.get('fov') || 40), shadow: null, ao: 2 }); } else setView(battle.views[shot]);

    const box = document.getElementById('labels');
    const drawLabels = () => { if (q.get('labels') === '0') return; box.innerHTML = battle.labels(camera, W, H).filter((l) => l.visible && (l.kind !== 'lane' || shot === 'approach') && (l.kind !== 'camp' || shot === 'camp')).map((l) => `<div class="lb ${l.kind}" style="left:${l.x}px;top:${l.y}px">${l.text}</div>`).join(''); };
    let time = 0;
    const render = (dt) => { time += dt; if (trees) trees.userData.U.uTime.value = time; water.userData.U.uTime.value = time; battle.tick(dt); if (controls) controls.update(); lens.render(); };
    render(0.5); drawLabels();
    if (q.get('measure')) {
      const measure = () => { renderer.info.autoReset = false; renderer.info.reset(); const f0 = performance.now(); lens.render(); renderer.getContext().finish(); const s = K.stats(renderer, scene, { frameMs: performance.now() - f0 }); renderer.info.autoReset = true; return s; };
      // &measure=1: the whole frame; &measure=nature: the battle hidden (sky, terrain, water, rocks, trees and the lens
      // quad); &measure=split: both, one after the other (the battle's share is the difference). Add &trees=0 for the
      // land without trees. Heavy frames (trees on) can make the software GPU drop the context after a few renders.
      if (q.get('measure') === 'nature') battle.group.visible = false;
      const all = measure();
      let nat = null; if (q.get('measure') === 'split') { battle.group.visible = false; nat = measure(); battle.group.visible = true; lens.render(); }
      window.__extra = { measure: all, part: q.get('measure') === 'nature' ? 'nature' : 'all', nature: nat && { calls: nat.calls, triangles: nat.triangles },
        stats: battle.stats(), trees: trees ? trees.userData.count : 0, buildMs: Math.round(tBuild - t0), parts: tm, landMs: Math.round(tLand - t0), tier, city: cid, mode: desc.mode, shot };
    }
    if (q.get('debug')) { // the battle's meshes by triangles (× instances), the heaviest first
      const rows = [], fr = new T.Frustum().setFromProjectionMatrix(new T.Matrix4().multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse)); battle.group.traverse((o) => { if (!o.isMesh && !o.isSprite) return; if (!o.visible || (o.frustumCulled && !fr.intersectsObject(o))) return; const g = o.geometry, t = (g.index ? g.index.count : g.attributes.position.count) / 3; rows.push([o.isSprite ? 'sprite' : o.isInstancedMesh ? 'inst' : 'mesh', Math.round(t), o.count || 1, Math.round(t * (o.count || 1)), o.castShadow ? 1 : 0, o.material.type + (o.material.customProgramCacheKey ? ':' + o.material.customProgramCacheKey() : '')]); });
      rows.sort((a, b) => b[3] - a[3]); (window.__extra = window.__extra || {}).meshes = { n: rows.length, sprites: rows.filter((r) => r[0] === 'sprite').length, top: rows.slice(0, 40).map((r) => r.join(' ')) };
    }
    window.__battle = battle; window.__done = true;
    if (q.get('play')) { let last = performance.now(); const loop = (now) => { render((now - last) / 1000); last = now; drawLabels(); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  } catch (e) { console.error(e); window.__error = String(e.stack || e); }

  // ---------------------------------------------------------------- the stand-in land (sg-nature.js SGN.land, generalised)
  // The prototype's land round Thọ Xuân, with the square city (cheb < HC) replaced by the real outline: cheb(x, z) is
  // HC + the signed distance to the wall line, so every "c < MOAT1 + 20" test of sg-nature.js still means "near the
  // walls". The moat follows the outline on the sides cities.json gives; the big river runs along the first river side
  // ~450 m out, a smaller one along the second; the siege ground and the camp lie on the attacker's side.
  function standInLand(N, def, plan, side) {
    const { h2, fbm2, ridged2 } = N.noise, { clamp, lerp, sstep } = N.util;
    const poly = plan.poly, n = poly.length, HC = 210, WATER = -1.0;
    const inPoly = (x, z) => { let c = false; for (let i = 0, j = n - 1; i < n; j = i++) { const [xi, zi] = poly[i], [xj, zj] = poly[j]; if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) c = !c; } return c; };
    const SIDE = (dx, dz) => (Math.abs(dx) > Math.abs(dz) ? (dx > 0 ? 'e' : 'w') : dz > 0 ? 's' : 'n');
    const cx0 = poly.reduce((a, p) => a + p[0], 0) / n, cz0 = poly.reduce((a, p) => a + p[1], 0) / n;
    // signed distance to the outline (positive outside) and the side the nearest edge faces
    const NRM = poly.map((a, i) => { const b = poly[(i + 1) % n]; let nx = -(b[1] - a[1]), nz = b[0] - a[0]; if (((a[0] + b[0]) / 2 - cx0) * nx + ((a[1] + b[1]) / 2 - cz0) * nz < 0) { nx = -nx; nz = -nz; } return SIDE(nx, nz); });
    const sdS = (x, z) => { let d = 1e9, s = 'n'; for (let i = 0; i < n; i++) { const [ax, az] = poly[i], [bx, bz] = poly[(i + 1) % n], dx = bx - ax, dz = bz - az, t = clamp(((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz || 1), 0, 1), e = Math.hypot(x - ax - dx * t, z - az - dz * t); if (e < d) { d = e; s = NRM[i]; } } return [inPoly(x, z) ? -d : d, s]; };
    const sd = (x, z) => sdS(x, z)[0], cheb = (x, z) => HC + sd(x, z);
    const DIRS = { n: [0, -1], s: [0, 1], e: [1, 0], w: [-1, 0] }, ext = (s) => Math.max(...poly.map((p) => p[0] * DIRS[s][0] + p[1] * DIRS[s][1]));
    const moatW = def.moat ? clamp((def.moat.width || 0.03) * plan.S, 20, 60) : 0, moatSides = def.moat ? def.moat.sides || 'nesw' : '';
    const MOAT0 = HC + 26, MOAT1 = HC + 26 + (moatW || 28);
    const dMoat = (x, z) => { if (!moatW) return 1e9; const [d, s] = sdS(x, z); if (!moatSides.includes(s)) return 1e9; return Math.max(26 - d, d - 26 - moatW); };
    // rivers in a side's frame: v out from the city, u along
    const rs = ((def.river && def.river.sides) || '').split('');
    const frame = (s) => { const d = DIRS[s]; return (x, z) => [x * d[1] * -1 + z * d[0], x * d[0] + z * d[1]]; }; // [u, v]
    const R0 = rs[0] ? { f: frame(rs[0]), v0: ext(rs[0]) + 450 } : null, R1 = rs[1] ? { f: frame(rs[1]), v0: ext(rs[1]) + 270 } : null;
    const bigV = (u) => R0.v0 + 95 * Math.sin(u / 540) + 42 * Math.sin(u / 215 + 1.3), bigD = (u) => (95 / 540) * Math.cos(u / 540) + (42 / 215) * Math.cos(u / 215 + 1.3);
    const smlV = (u) => R1.v0 + 85 * Math.sin(u / 340 + 0.4) + 28 * Math.sin(u / 150), smlD = (u) => (85 / 340) * Math.cos(u / 340 + 0.4) + (28 / 150) * Math.cos(u / 150);
    const riverSD = (x, z) => {
      let d = 1e9;
      if (R0) { const [u, v] = R0.f(x, z); d = Math.abs(v - bigV(u)) / Math.sqrt(1 + bigD(u) ** 2) - 90; }
      if (R1) { const [u, v] = R1.f(x, z), [, v0] = R0.f(x, z); if (v0 < bigV(R0.f(x, z)[0]) + 30) d = Math.min(d, Math.abs(v - smlV(u)) / Math.sqrt(1 + smlD(u) ** 2) - 31); }
      return d;
    };
    const waterSD = (x, z) => Math.min(riverSD(x, z), dMoat(x, z));
    // hills north-east (Bagong), pushed out with the city
    const push = Math.max(0, plan.half - 210), HX = 900 + push, HZ = -230 - push * 0.4;
    const hills = (x, z) => { const a = Math.hypot((x - HX) / 560, (z - HZ) / 360), b = Math.hypot((x - HX - 450) / 330, (z - HZ - 390) / 260); const m = Math.max(0, 1 - a) ** 1.25 * 120 + Math.max(0, 1 - b) ** 1.4 * 60; return m * (0.62 + 0.75 * ridged2(x / 190 + 3, z / 190)); };
    const farMtn = (x, z) => { const r = Math.hypot(x * 0.85, z), k = sstep(2300, 4300, r); return k * (140 + 520 * ridged2(x / 700 + 9, z / 700, 5) ** 1.6 + 60 * ridged2(x / 160, z / 160)); };
    const land = (x, z) => 3.4 + 6.5 * (fbm2(x / 480, z / 480) - 0.5) + 1.2 * (fbm2(x / 95, z / 95) - 0.5) + hills(x, z) + farMtn(x, z);
    const h = (x, z) => { let y = land(x, z); const d = sd(x, z); y = lerp(2.0, y, sstep(16, 24, d)); y = lerp(-5.5, y, sstep(-8, 34, riverSD(x, z))); if (moatW) y = lerp(-4.0, y, sstep(-2, 4, dMoat(x, z))); return y; };
    // roads from the middle of each side, out to the edge (or the river bank)
    const wavy = (pts, amp, s0) => { const out = []; for (let i = 0; i < pts.length - 1; i++) { const [ax, az] = pts[i], [bx, bz] = pts[i + 1], Ln = Math.hypot(bx - ax, bz - az), m = Math.max(2, Math.round(Ln / 20)), nx = -(bz - az) / Ln, nz = (bx - ax) / Ln; for (let k = 0; k < m; k++) { const t = k / m, w = amp * (fbm2(s0 + (i + t) * 1.7, s0) - 0.5) * Math.sin(Math.PI * Math.min(1, t * 4)); out.push([ax + (bx - ax) * t + nx * w, az + (bz - az) * t + nz * w]); } } out.push(pts[pts.length - 1]); return out; };
