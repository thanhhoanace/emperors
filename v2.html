<style>html,body{margin:0;background:#15120f;overflow:hidden;touch-action:none}canvas{display:block}
/* the loading screen (huainan-show.js drives its progress and dissolves it once the scene stands): ink mountains under an autumn
   moon, the title, the seal 明 in a turning brush circle. Everything that moves is transform or opacity, so it keeps moving on the
   compositor while the main thread builds the map. */
#loading{position:fixed;inset:0;z-index:60;overflow:hidden;display:grid;place-items:center;text-align:center;color:#efe6d2;font:18px "Noto Serif",Georgia,serif;letter-spacing:.04em;
  background:radial-gradient(95% 75% at 74% 20%,#2e271e 0%,#1c1813 44%,#0f0d0a 100%);transition:opacity 1.2s ease}
#loading::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 110% at 50% 42%,transparent 52%,rgba(0,0,0,.5))}
#loading.out{opacity:0;pointer-events:none}
#loading .ld-l{position:absolute;left:-3%;width:106%;display:block;will-change:transform;animation:ldsway 34s ease-in-out infinite alternate}
#loading .ld-far{bottom:13%;height:46%;animation-duration:46s}
#loading .ld-mid{bottom:3%;height:36%;animation-direction:alternate-reverse}
#loading .ld-near{bottom:-1%;height:22%;animation:none}
#loading .ld-mist{position:absolute;left:-25%;width:150%;height:17%;pointer-events:none;will-change:transform;background:radial-gradient(50% 50% at 50% 50%,rgba(233,224,204,.075),rgba(233,224,204,0) 70%);animation:ldmist 27s ease-in-out infinite alternate}
#loading .ld-m1{bottom:27%}#loading .ld-m2{bottom:9%;height:14%;animation-duration:21s;animation-direction:alternate-reverse}
#loading .ld-moon{position:absolute;right:13%;top:7%;width:clamp(90px,24vmin,230px);height:clamp(90px,24vmin,230px);border-radius:50%;
  background:radial-gradient(circle,rgba(250,240,214,.2) 0%,rgba(250,240,214,.17) 27%,rgba(250,240,214,.07) 31%,rgba(250,240,214,.025) 48%,rgba(250,240,214,0) 70%)}
#loading .ld-geese{position:absolute;left:0;top:19%;width:clamp(60px,12vmin,120px);fill:none;stroke:rgba(12,10,8,.85);stroke-width:1.7;stroke-linecap:round;will-change:transform;animation:ldgeese 40s linear infinite}
#loading .ld-wm{position:absolute;left:5.5%;top:0;height:100%;margin:0;display:flex;flex-direction:column;justify-content:center;font:700 clamp(34px,11vmin,104px)/1.14 "Noto Serif TC","Noto Serif CJK TC",serif;color:rgba(233,224,204,.055)}
#loading .ld-col{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;font-size:clamp(13px,calc(2.4vmin + 4px),26px);transform:translateY(-5%);transition:transform 1.2s ease}
#loading.out .ld-col{transform:translateY(-12%)}#loading.out .ld-l{transform:translateY(8%)}
#loading .ld-mark{position:relative;width:5.4em;height:5.4em;display:grid;place-items:center;margin-bottom:.5em}
#loading .ld-enso{position:absolute;inset:0;width:100%;height:100%;fill:rgba(226,214,188,.8);will-change:transform;animation:ldspin 9s linear infinite}
#loading .ld-seal{width:1.5em;height:1.5em;display:grid;place-items:center;font:700 1.62em/1 "Noto Serif TC","Noto Serif CJK TC","Noto Serif",serif;color:#f6eedb;border-radius:.14em;
  background:#a8281f;box-shadow:inset 0 0 0 .07em #a8281f,inset 0 0 0 .11em rgba(246,238,219,.7),0 .1em .5em rgba(0,0,0,.4);transform:rotate(-4deg);filter:url(#ld-rough)}
#loading .ld-title{margin:0;font-weight:700;font-size:2.5em;line-height:1.08;letter-spacing:.045em;color:#f3ead6;text-shadow:0 2px 20px rgba(0,0,0,.55)}
#loading .ld-brush{width:12.5em;height:.62em;margin:.28em 0 .5em;fill:#b3262e;transform-origin:0 50%;animation:ldbrush 1.5s .25s cubic-bezier(.3,.75,.2,1) both}
#loading .ld-sub{margin:0;padding-left:.36em;font-size:.9em;letter-spacing:.36em;text-transform:uppercase;color:#e2bf6c}
#loading .ld-bar{position:relative;width:10em;height:2px;margin-top:1.55em;border-radius:1px;overflow:hidden;background:rgba(233,224,204,.13)}
#loading .ld-bar i{position:absolute;left:0;top:0;width:100%;height:100%;background:linear-gradient(90deg,#7d6230,#e2bf6c);transform-origin:0 50%;transform:scaleX(0);will-change:transform}
#loading .ld-bar i:first-child{animation:ldboot 24s cubic-bezier(.05,.6,.25,1) forwards}
#loading .ld-step{margin:.6em 0 0;min-height:1.3em;font-size:.74em;letter-spacing:.12em;color:#a89a7d}
@keyframes ldspin{to{transform:rotate(360deg)}}
@keyframes ldsway{from{transform:translateX(-1.2%)}to{transform:translateX(1.2%)}}
@keyframes ldmist{from{transform:translateX(-7%)}to{transform:translateX(7%)}}
@keyframes ldgeese{from{transform:translate(105vw,0)}to{transform:translate(-30vw,-6vh)}}
@keyframes ldbrush{from{transform:scaleX(0)}}
@keyframes ldboot{to{transform:scaleX(.7)}}
@media (prefers-reduced-motion:reduce){#loading *{animation-duration:0s!important;animation-iteration-count:1!important}}</style>
