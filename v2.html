<body>

<!-- v2 polish (docs/design/v2-polish.md): modules that register HuaiNanPlay hooks load here, after huainan-play.js -->
<script>
// Tam Quốc Loạn Nhập v2, Demo Hoài Nam (docs/product/GAMEPLAY-FREEZE.md, docs/design/v2-build.md): Chu Nguyên Chương,
// five towns, one season at a time, on the real 3D map. The v1 game (20 provinces) stays at game.html.
//   &seed=N fixes the game · &tier=high|mid|low forces the quality tier · &hud=1 tier, fps, triangles · &qa=1 high tier
HuaiNanPlay.boot({ params: new URLSearchParams(location.search) }).catch((e) => {
  console.error(e); window.__error = String((e && e.stack) || e);
  const l = document.getElementById('loading'); if (l) l.textContent = 'Lỗi: ' + e.message;
});
</script>
