<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,">
<title>Thiên hạ bằng giấy</title>
<style>
:root{--ink:#3b3226;--card:#fbf3e2;--edge:#d9c7a3;--accent:#c4573a;--bg1:#cfe5e6;--bg2:#f6ead2}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;color:var(--ink);font:600 13px/1.25 "Be Vietnam Pro","Noto Sans",system-ui,sans-serif;
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%)}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.chip{position:fixed;z-index:5;background:var(--card);border-radius:8px;padding:5px 10px;box-shadow:0 2px 0 var(--edge),0 4px 8px rgba(60,40,20,.18);pointer-events:none}
#season{left:max(10px,env(safe-area-inset-left));top:8px;font-weight:700;letter-spacing:.03em}
#res{left:50%;top:8px;transform:translateX(-50%);display:flex;gap:12px}
#res b{font-weight:700}
button{font:inherit;font-weight:700;color:#fff;background:var(--accent);border:0;border-radius:9px;padding:9px 16px;box-shadow:0 3px 0 #8e3a24,0 6px 10px rgba(60,40,20,.25);cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #8e3a24}
button.alt{background:#3a8a88;box-shadow:0 3px 0 #276361,0 6px 10px rgba(60,40,20,.25)}
button[disabled]{opacity:.5}
#end{right:max(10px,env(safe-area-inset-right));bottom:10px;position:fixed;z-index:6}
#info{left:max(10px,env(safe-area-inset-left));bottom:10px;max-width:46vw;pointer-events:none}
#info small{display:block;font-weight:400;opacity:.8}
#ask{position:fixed;z-index:7;left:50%;bottom:58px;transform:translateX(-50%);display:none;gap:8px;align-items:center;background:var(--card);padding:8px 10px;border-radius:10px;box-shadow:0 2px 0 var(--edge),0 6px 14px rgba(60,40,20,.25)}
#toast{position:fixed;z-index:6;left:50%;top:44px;transform:translateX(-50%);max-width:70vw;text-align:center;opacity:0;transition:opacity .4s;pointer-events:none}
#toast.on{opacity:1}
.lbl{position:fixed;left:0;top:0;z-index:4;pointer-events:none;white-space:nowrap;font-size:11px;font-weight:700;background:rgba(251,243,226,.92);border-radius:6px;padding:1px 6px 1px 4px;box-shadow:0 1px 0 var(--edge);will-change:transform}
.lbl i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:-0.5px;box-shadow:0 0 0 1.5px #fff8}
.lbl small{display:none;font-weight:600;opacity:.75;margin-left:4px;font-size:10px}
.lbl.city small{display:inline}
.lbl.far{font-size:10px;padding:0 5px 0 3px}
.lbl.far i{width:7px;height:7px}
.legend{right:max(10px,env(safe-area-inset-right));bottom:10px;display:flex;gap:7px;font:700 13px/1 "WenQuanYi Zen Hei","Noto Sans CJK SC",serif}
.legend span{display:flex;align-items:center;gap:3px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;box-shadow:0 1px 0 #0003}
#boot{position:fixed;inset:0;display:grid;place-items:center;z-index:9;font-weight:700;letter-spacing:.06em;transition:opacity .6s}
#boot.out{opacity:0;pointer-events:none}
</style></head>
<body>
<div id="boot">Đang cắt giấy…</div>
<div id="season" class="chip">Thu 219</div>
<div id="res" class="chip"><span>Lương <b id="r-luong">0</b></span><span>Tiền <b id="r-tien">0</b></span><span>Uy <b id="r-uy">0</b></span></div>
<div id="toast" class="chip"></div>
<div id="info" class="chip" hidden></div>
<div id="ask"><span id="ask-t"></span><button id="ask-atk">Tấn công</button><button id="ask-siege" class="alt">Vây thành</button></div>
<button id="end">Hết mùa</button>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
<script src="src/engine/battle.js"></script>
<script src="src/engine/v2/huainan.js"></script>
<script src="src/world/paper.js"></script>
<script src="src/world/terrain.js"></script>
<script src="src/world/terrain-real.js"></script>
<script src="src/world/paper-world.js"></script>
<script>PaperKit.boot();</script>
</body></html>
