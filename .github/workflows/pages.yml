name: Test and deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'game.html'
      - 'src/**'
      - 'data/**'
      - 'assets/**'
      - 'server/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'game.html'
      - 'src/**'
      - 'data/**'
      - 'server/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Engine tests
        run: npm test
      - name: Start server
        run: node server/server.js > /tmp/emperors-server.log 2>&1 & echo $! > /tmp/server.pid
      - name: Wait for server
        run: |
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Browser QA
        run: xvfb-run -a npm run qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa
          path: |
            test-results/
            /tmp/emperors-server.log

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: qa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble site (runtime files only)
        run: |
          mkdir _site
          cp -r index.html game.html src data assets _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
