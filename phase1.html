<!doctype html>
<html lang="vi">
<head>

<link rel="icon" href="data:,">
<meta property="og:image" content="https://d2ol7oe51mr4n9.cloudfront.net/user_3JU0VAMBJ6R09Fi1AU1y9R0E9LE/2736abaa-62f4-4659-a357-60ca80d66ebb.png">
<style>
:root{--lac:#311814;--lac2:#1b100d;--bronze:#c09a55;--cream:#f2deb0;--muted:#ad915d}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#15110d;color:var(--cream);font-family:Georgia,"Times New Roman",serif}
#game,canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#title{position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle at 50% 42%,rgba(128,71,31,.35),rgba(17,10,8,.96));animation:titleAway 1s ease 2.15s forwards}
#title .plate{padding:36px 58px;text-align:center;background:linear-gradient(180deg,rgba(64,27,20,.9),rgba(22,13,10,.86));border:1px solid rgba(192,154,85,.55);box-shadow:0 22px 90px rgba(0,0,0,.48),inset 0 0 35px rgba(255,214,123,.04)}
#title h1{margin:0;font-size:clamp(34px,5vw,72px);letter-spacing:.12em;color:#f3d486;text-shadow:0 3px 22px #000}#title p{margin:11px 0 0;font-size:12px;letter-spacing:.35em;color:#caa75f}
@keyframes titleAway{to{opacity:0;visibility:hidden}}
.panel{background:linear-gradient(180deg,rgba(53,24,20,.94),rgba(23,13,10,.91));border:1px solid rgba(192,154,85,.68);border-radius:8px;box-shadow:0 9px 28px rgba(0,0,0,.36),inset 0 0 0 1px rgba(255,230,170,.05)}
#top{position:fixed;left:16px;right:16px;top:14px;z-index:20;display:flex;justify-content:space-between;gap:14px;pointer-events:none}.faction,.turn{padding:11px 14px}.faction b,.turn b{color:#e3c575;letter-spacing:.08em}.faction small,.turn small{display:block;color:#ad915d;margin-top:3px}.turn{text-align:right;min-width:240px}
#stats{position:fixed;left:16px;bottom:16px;z-index:20;width:min(515px,calc(100vw - 32px));padding:12px 14px}.row{display:grid;grid-template-columns:84px 1fr 58px;gap:10px;align-items:center;margin:7px 0}.row label{font-size:12px;letter-spacing:.07em;color:#c3a66c}.track{height:8px;background:#251712;border:1px solid #684d2d;border-radius:999px;overflow:hidden}.track i{height:100%;display:block;background:linear-gradient(90deg,#75592e,#d1aa5c);transition:width .55s ease}.row span{text-align:right;font-size:12px;color:#e4cf9d}
#action{position:fixed;right:16px;bottom:16px;z-index:24;display:flex;gap:10px;align-items:flex-end}.selected{min-width:230px;max-width:330px;padding:10px 12px;font-size:13px;color:#d7c18e;pointer-events:none}.selected b{display:block;color:#f2d58b;margin-bottom:4px}.selected em{font-style:normal;color:#a98b58}
button{appearance:none;border:1px solid #c29b54;border-radius:7px;color:#f7dfa7;background:linear-gradient(#60291f,#2b1713);padding:12px 18px;font:700 14px Georgia,serif;letter-spacing:.09em;cursor:pointer;box-shadow:0 7px 18px rgba(0,0,0,.35)}button:hover{filter:brightness(1.14)}button:disabled{opacity:.48;cursor:default}
#speech{position:fixed;z-index:30;display:none;max-width:310px;padding:10px 13px;border-radius:12px;border:2px solid #6b4728;background:#f4e3b7;color:#26170f;font-size:15px;font-weight:700;box-shadow:0 9px 24px rgba(0,0,0,.38);pointer-events:none}#speech:after{content:"";position:absolute;left:28px;bottom:-12px;border:7px solid transparent;border-top-color:#6b4728}
#flash{position:fixed;inset:0;z-index:28;pointer-events:none;opacity:0;background:radial-gradient(circle at 57% 48%,rgba(255,225,125,.98),rgba(219,74,29,.28) 19%,transparent 45%)}#flash.go{animation:flash .55s ease}@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
#tip{position:fixed;left:50%;bottom:16px;z-index:19;transform:translateX(-50%);padding:7px 12px;border-radius:999px;background:rgba(25,15,12,.72);border:1px solid rgba(192,154,85,.35);color:#d4bd87;font-size:12px;pointer-events:none}
#statusline{color:#d7bc76!important}.ready{color:#89b883!important}
@media(max-width:760px){#top{left:9px;right:9px;top:8px}.turn{min-width:0}.faction,.turn{font-size:12px;padding:9px}.turn small{max-width:140px}#stats{left:9px;bottom:9px;width:calc(100vw - 18px);padding:8px}#action{right:9px;bottom:147px}.selected{min-width:185px;max-width:235px}#tip{display:none}}
</style>
</head>
<body>
<div id="game"></div>
<div id="title"><div class="plate"><h1>TAM QUỐC LOẠN NHẬP</h1><p>PHASE I · CLIP SLICE</p></div></div>
<div id="top"><div class="panel faction"><b>LIU BEI · XIANGYANG</b><small>Leaf Green · Player</small></div><div class="panel turn"><b>TURN <span id="turnNo">1</span></b><small id="statusline">Click Xiangyang, then Chengdu.</small></div></div>
<div id="stats" class="panel"></div>
<div id="action"><div id="selected" class="panel selected"><b>No capital selected</b><em>Click a walled capital to inspect it.</em></div><button id="endTurn">END TURN</button></div>
<div id="speech">Hán thất chưa tắt. Kinh không bỏ.</div><div id="flash"></div><div id="tip">Drag: orbit · Wheel: zoom · Click capital · End Turn: march</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.js"></script>
<script>

const scene=new THREE.Scene();scene.background=new THREE.Color(0x6e5437);scene.fog=new THREE.FogExp2(0x765a3d,.0066);
const camera=new THREE.PerspectiveCamera(47,innerWidth/innerHeight,.1,800);camera.position.set(12,110,151);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.getElementById('game').appendChild(renderer.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=54;controls.maxDistance=235;controls.maxPolarAngle=Math.PI*.46;controls.target.set(0,0,5);controls.update();
window.scene=scene;window.camera=camera;window.renderer=renderer;window.controls=controls;
scene.add(new THREE.HemisphereLight(0xe4d4ac,0x343923,1.75));const sun=new THREE.DirectionalLight(0xffd29a,3.2);sun.position.set(-85,125,-75);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-150;sun.shadow.camera.right=150;sun.shadow.camera.top=130;sun.shadow.camera.bottom=-130;scene.add(sun);
const world=new THREE.Group();scene.add(world);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,190),new THREE.MeshStandardMaterial({color:0x74863d,roughness:.99}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;world.add(ground);
function rnd(n){const x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x)}
for(let i=0;i<570;i++){const x=(rnd(i+4)-.5)*248,z=(rnd(i+14)-.5)*178;const m=new THREE.Mesh(new THREE.ConeGeometry(.11+rnd(i+33)*.18,.45+rnd(i+55)*.45,4),new THREE.MeshStandardMaterial({color:rnd(i+72)>.5?0x6b7a38:0x839047,roughness:1}));m.position.set(x,.25,z);m.rotation.y=rnd(i+83)*Math.PI;world.add(m)}
function tube(points,r,color,segments=72,y=.16){const c=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(p[0],y,p[1])));const mesh=new THREE.Mesh(new THREE.TubeGeometry(c,segments,r,10,false),new THREE.MeshStandardMaterial({color,roughness:.72,metalness:.03}));mesh.receiveShadow=true;world.add(mesh);return c}
const yellow=tube([[-120,-35],[-84,-27],[-50,-35],[-9,-26],[30,-30],[70,-20],[119,-30]],2.35,0x2b9c83,110,.17);
const yangtze=tube([[-118,39],[-79,29],[-42,34],[-10,25],[24,35],[59,29],[92,42],[121,36]],3.05,0x2b8f79,120,.18);
function road(points){return tube(points,.62,0x927044,54,.20)}
const roads=[road([[-73,13],[-56,2],[-36,8],[-16,18]]),road([[-16,18],[1,29],[17,42],[30,53]]),road([[-16,18],[2,7],[24,-3],[46,-2]]),road([[46,-2],[64,8],[81,17],[101,17]]),road([[-16,18],[-28,-1],[-47,-14],[-67,-18]]),road([[-67,-18],[-83,-2],[-91,17]])];const marchRoad=roads[1];
function ridge(x,z,count,dx,dz,seed){const g=new THREE.Group();for(let i=0;i<count;i++){const h=7+rnd(seed+i)*15,r=5.5+rnd(seed+i+22)*7;const peak=new THREE.Mesh(new THREE.ConeGeometry(r,h,6),new THREE.MeshStandardMaterial({color:h>16?0x7e8377:0x596044,roughness:1}));peak.position.set(x+i*dx+(rnd(seed+i+40)-.5)*5,h/2,z+i*dz+(rnd(seed+i+60)-.5)*5);peak.rotation.y=rnd(seed+i+80)*Math.PI;peak.castShadow=true;peak.receiveShadow=true;g.add(peak);if(h>16){const snow=new THREE.Mesh(new THREE.ConeGeometry(r*.46,h*.22,6),new THREE.MeshStandardMaterial({color:0xd9dad3,roughness:.9}));snow.position.set(peak.position.x,h*.89,peak.position.z);snow.rotation.y=peak.rotation.y;g.add(snow)}}world.add(g)}
ridge(-114,-70,18,11.5,1.7,21);ridge(-24,-76,16,10,1.5,91);ridge(-119,72,19,12,-1.1,161);
function tree(x,z,s=.8){const g=new THREE.Group();const tr=new THREE.Mesh(new THREE.CylinderGeometry(.13,.22,1.2,5),new THREE.MeshStandardMaterial({color:0x50361f}));tr.position.y=.6;const cr=new THREE.Mesh(new THREE.ConeGeometry(1.05*s,2.7*s,7),new THREE.MeshStandardMaterial({color:0x31552d,roughness:1}));cr.position.y=1.8*s;g.add(tr,cr);g.position.set(x,0,z);world.add(g)}
for(let i=0;i<128;i++){const x=(rnd(i+300)-.5)*220,z=(rnd(i+400)-.5)*145;if(rnd(i+500)>.32)tree(x,z,.64+rnd(i+600)*.25)}
function roof(w,d,color=0x2b2824){const g=new THREE.Group();const slab=new THREE.Mesh(new THREE.BoxGeometry(w,.35,d),new THREE.MeshStandardMaterial({color,roughness:.85}));slab.rotation.z=.04;g.add(slab);for(let i=-2;i<=2;i++){const line=new THREE.Mesh(new THREE.BoxGeometry(.07,.05,d*1.04),new THREE.MeshStandardMaterial({color:0x171513,roughness:.9}));line.position.set(i*w/6,.22,0);g.add(line)}return g}
const cityHit=[];const cities={};
function city(name,x,z){const g=new THREE.Group();g.userData={type:'city',name};const brick=new THREE.MeshStandardMaterial({color:0x77736a,roughness:.96});const wood=new THREE.MeshStandardMaterial({color:0x633b24,roughness:.9});const court=new THREE.Mesh(new THREE.CylinderGeometry(8.2,8.7,.5,8),new THREE.MeshStandardMaterial({color:0xa48658,roughness:1}));court.position.y=.25;court.receiveShadow=true;g.add(court);const walls=[[0,1.7,-6.2,12,.9,.9],[0,1.7,6.2,12,.9,.9],[-6.2,1.7,0,.9,.9,12],[6.2,1.7,0,.9,.9,12]];for(const [px,py,pz,sx,sy,sz] of walls){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy*3.1,sz),brick);m.position.set(px,py,pz);m.castShadow=true;m.receiveShadow=true;g.add(m)}
const gateGap=new THREE.Mesh(new THREE.BoxGeometry(3.0,3.1,1.2),wood);gateGap.position.set(0,1.7,6.3);g.add(gateGap);const gateRoof=roof(4.5,2.5);gateRoof.position.set(0,3.7,6.3);g.add(gateRoof);
for(const tx of [-5.3,5.3]){const t=new THREE.Group();const body=new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.4,4.3,6),brick);body.position.y=2.15;t.add(body);const rf=roof(3.3,3.3);rf.position.y=4.55;t.add(rf);t.position.set(tx,0,5.3);g.add(t)}
for(const [px,pz] of [[-2,-1.8],[2,-1.8],[0,1.2]]){const hall=new THREE.Mesh(new THREE.BoxGeometry(3.3,2.2,2.6),wood);hall.position.set(px,1.1,pz);g.add(hall);const rf=roof(4.0,3.3,0x30302b);rf.position.set(px,2.4,pz);g.add(rf)}
g.position.set(x,0,z);g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.userData.cityRoot=name;cityHit.push(o)}});world.add(g);cities[name]=g;return g}
const data=[
{name:'Qin Shihuang',city:"Chang'an",color:0xd2a11d,trim:0x171717,pos:[-67,-18]},
{name:'Li Shimin',city:'Jinyang',color:0x52799a,trim:0xc6d1d7,pos:[-91,17]},
{name:'Zhu Yuanzhang',city:'Pengcheng',color:0x8e2828,trim:0x3c1010,pos:[46,-2]},
{name:'Liu Che',city:'Chengdu',color:0x6d4b90,trim:0xd4bce9,pos:[30,53]},
{name:'Cao Cao',city:'Ye',color:0x536d3b,trim:0x202819,pos:[-73,13]},
{name:'Liu Bei',city:'Xiangyang',color:0x529a46,trim:0xd2e9c9,pos:[-16,18]},
{name:'Sun Quan',city:'Jianye',color:0xc68028,trim:0x4a2811,pos:[101,17]}
];
function sprite(text,bg='#2a1712',fg='#f0d69a',scale=1){const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle=bg;ctx.strokeStyle='#ba9250';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(4,4,504,120,18);ctx.fill();ctx.stroke();ctx.fillStyle=fg;ctx.font='700 34px Georgia';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,256,64);const tex=new THREE.CanvasTexture(c);tex.encoding=THREE.sRGBEncoding;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));sp.scale.set(24*scale,6*scale,1);return sp}
function general(f){const g=new THREE.Group();g.userData={type:'general',name:f.name,city:f.city};const cloth=new THREE.MeshStandardMaterial({color:f.color,roughness:.78});const dark=new THREE.MeshStandardMaterial({color:f.trim,roughness:.82});const skin=new THREE.MeshStandardMaterial({color:0xc99363,roughness:.8});const body=new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.35,3.6,7),cloth);body.position.y=3.15;const shoulders=new THREE.Mesh(new THREE.BoxGeometry(3.1,.65,1.35),dark);shoulders.position.y=4.45;const head=new THREE.Mesh(new THREE.SphereGeometry(.92,14,10),skin);head.position.y=5.78;const hat=new THREE.Mesh(new THREE.CylinderGeometry(.72,.9,.45,8),dark);hat.position.y=6.65;const eyeMat=new THREE.MeshBasicMaterial({color:0x24160f});for(const ex of [-.28,.28]){const e=new THREE.Mesh(new THREE.SphereGeometry(.07,6,4),eyeMat);e.position.set(ex,5.93,.86);g.add(e)}const beard=new THREE.Mesh(new THREE.ConeGeometry(.28,.85,7),dark);beard.position.set(0,5.15,.65);beard.rotation.x=.28;g.add(body,shoulders,head,hat,beard);
const pole=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,7.7,6),new THREE.MeshStandardMaterial({color:0x4b3222}));pole.position.set(2.05,4.0,0);const flag=new THREE.Mesh(new THREE.PlaneGeometry(3.7,2.25),cloth);flag.position.set(3.85,6.4,0);flag.rotation.y=Math.PI/2;g.add(pole,flag);const name=sprite(f.name,'#251510','#f0d999',.8);name.position.set(0,9.0,0);g.add(name);g.position.set(f.pos[0],0.55,f.pos[1]);world.add(g);return g}
const generals={};for(const f of data){city(f.city,...f.pos);generals[f.name]=general(f)}
const capitalLabels=[];for(const f of data){const s=sprite(f.city,'#3a1d15','#e9ce8d',.65);s.position.set(f.pos[0],12.6,f.pos[1]);scene.add(s);capitalLabels.push(s)}
const stats={Troops:72,Grain:66,Territory:44,Morale:61,Prestige:49};const after={Troops:65,Grain:58,Territory:48,Morale:68,Prestige:55};
function drawStats(){const max={Troops:100,Grain:100,Territory:100,Morale:100,Prestige:100};document.getElementById('stats').innerHTML=Object.entries(stats).map(([k,v])=>`<div class="row"><label>${k}</label><div class="track"><i style="width:${v/max[k]*100}%"></i></div><span>${v}</span></div>`).join('')}
drawStats();
let selectedCity=null,targetChosen=false,marching=false,turn=1;const selected=document.getElementById('selected'),status=document.getElementById('statusline'),speech=document.getElementById('speech'),flash=document.getElementById('flash'),endTurn=document.getElementById('endTurn');
function selectCity(name){selectedCity=name;const f=data.find(x=>x.city===name);selected.innerHTML=`<b>${name}</b><em>${f.name} · ${name==='Xiangyang'?'Player Capital':'Scripted AI Capital'}</em>`;if(name==='Xiangyang'){status.textContent='Xiangyang selected. Now click Chengdu.';targetChosen=false}else if(name==='Chengdu'){status.textContent='Route Xiangyang → Chengdu armed. Press End Turn.';status.classList.add('ready');targetChosen=true}else{status.textContent=`${name} inspected. Liu Bei needs Chengdu.`;targetChosen=false;status.classList.remove('ready')}}
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{if(marching)return;const r=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(cityHit,false);if(hits.length)selectCity(hits[0].object.userData.cityRoot)});
function projectCity(name){const v=cities[name].position.clone();v.y=2.2;v.project(camera);const r=renderer.domElement.getBoundingClientRect();return{x:r.left+(v.x+1)*.5*r.width,y:r.top+(-v.y+1)*.5*r.height}}
function placeSpeech(){const p=generals['Liu Bei'].position.clone();p.y+=8;p.project(camera);speech.style.left=((p.x+1)*.5*innerWidth+14)+'px';speech.style.top=((1-p.y)*.5*innerHeight-20)+'px'}
async function march(){if(marching||!targetChosen){status.textContent='Select Xiangyang, then Chengdu before ending the turn.';return}marching=true;endTurn.disabled=true;turn++;document.getElementById('turnNo').textContent=turn;status.classList.remove('ready');status.textContent='Liu Bei marches toward Chengdu…';speech.style.display='block';placeSpeech();const unit=generals['Liu Bei'];const start=performance.now(),dur=3100;await new Promise(resolve=>{function step(now){const t=Math.min(1,(now-start)/dur),e=1-Math.pow(1-t,3);const p=marchRoad.getPoint(.04+e*.82);unit.position.x=p.x;unit.position.z=p.z;placeSpeech();if(t<1)requestAnimationFrame(step);else resolve()}requestAnimationFrame(step)});speech.style.display='none';flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');status.textContent='Clash at Shu Road — Liu Bei holds the pass.';Object.assign(stats,after);drawStats();await new Promise(r=>setTimeout(r,560));const enemy=generals['Liu Che'];const mid=unit.position.clone().lerp(enemy.position,.46);controls.target.copy(mid);camera.position.set(mid.x+32,58,mid.z+62);controls.update();status.textContent='Clip state ready: both banners held in frame.';endTurn.disabled=false;targetChosen=false;marching=false;window.__slice.lastResult={moved:true,stats:{...stats},turn}}
endTurn.addEventListener('click',march);
window.__slice={selectCity,projectCity,getState:()=>({selectedCity,targetChosen,marching,turn,stats:{...stats},liuBei:{x:generals['Liu Bei'].position.x,z:generals['Liu Bei'].position.z}}),lastResult:null};
window.__sliceReady=true;
function animate(){requestAnimationFrame(animate);controls.update();if(speech.style.display==='block')placeSpeech();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
<button id="cinematicBtn" type="button" style="position:fixed;right:16px;bottom:78px;z-index:31;border:1px solid #a98043;background:linear-gradient(#47241b,#21130f);color:#f2deb0;border-radius:7px;padding:10px 14px;font:600 12px Georgia,serif;letter-spacing:.08em;cursor:pointer">12s CINEMATIC</button>
<div id="cinematicOverlay" style="display:none;position:fixed;inset:0;z-index:80;background:#090706;align-items:center;justify-content:center">
<video id="cinematicVideo" controls playsinline poster="https://d2ol7oe51mr4n9.cloudfront.net/user_3JU0VAMBJ6R09Fi1AU1y9R0E9LE/2736abaa-62f4-4659-a357-60ca80d66ebb.png" style="width:min(96vw,1280px);max-height:90vh;border:1px solid #a98043;background:#000"><source src="https://d2ol7oe51mr4n9.cloudfront.net/user_3JU0VAMBJ6R09Fi1AU1y9R0E9LE/80309863-f9fb-45fb-8641-8376d0973df4.mp4" type="video/mp4"></video>
<button id="cinematicClose" type="button" style="position:absolute;right:18px;top:18px;border:1px solid #a98043;background:#311814;color:#f2deb0;border-radius:999px;width:38px;height:38px;cursor:pointer">×</button>
</div>
<script>(()=>{const b=document.getElementById('cinematicBtn'),o=document.getElementById('cinematicOverlay'),v=document.getElementById('cinematicVideo'),x=document.getElementById('cinematicClose');b?.addEventListener('click',()=>{o.style.display='flex';v.currentTime=0;v.play().catch(()=>{});});x?.addEventListener('click',()=>{v.pause();o.style.display='none';});})();</script>
</body>
</html>
