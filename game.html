<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<title>Tam Quốc Loạn Nhập</title>
<style>html,body{margin:0;background:#15120f;overflow:hidden}canvas{display:block}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:#e9e0cc;font:18px "Noto Serif",Georgia,serif;letter-spacing:.08em}</style>
</head>
<body>
<div id="loading">Đang dựng thiên hạ năm 219…</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="src/engine/engine.js"></script>
<script src="src/engine/attach-219.js"></script>
<script src="src/engine/perception.js"></script>
<script src="src/world/kit.js"></script>
<script src="src/world/city.js"></script>
<script src="src/world/hancity.js"></script>
<script src="src/world/terrain.js"></script>
<script src="src/world/terrain-real.js"></script>
<script src="src/world/flora.js"></script>
<script src="src/world/names.js"></script>
<script src="src/world/world-runtime.js"></script>
<script src="src/world/event-presenter.js"></script>
<script src="src/world/hud.js"></script>
<script src="src/world/game-controller.js"></script>
<script src="src/world/player-ui.js"></script>
<script src="src/world/demo.js"></script>
<script>
// Tam Quốc Loạn Nhập, autumn 219. Engine → RuntimeEvent v1 → EventPresenter → WorldRuntime + HUD (docs/architecture.md).
//   default   play: choose one of the four emperors, one order a season, the real engine resolves every turn
//             (&seed=N fixes the game; &speed=N the playback speed)
//   ?demo=1   RuntimeEvent showcase on fixtures or one server turn (src/world/demo.js)
(async () => {
  const params = new URLSearchParams(location.search);
  const DEMO = params.has('demo');
  const W = Number(params.get('w')) || innerWidth, H = Number(params.get('h')) || innerHeight;
  const json = (u) => fetch(u).then((r) => { if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); });
  const [world, cities, characters, gates, intelRules, fixtures] = await Promise.all([
    json('data/world.json'), json('data/cities.json').then((j) => j.cities), json('data/scenario/characters.json'),
    json('data/scenario/gates.json'), json('data/scenario/intel-rules.json'), json('data/scenario/runtime-events.v1.json'),
  ]);
  const personas = Object.fromEntries(await Promise.all(world.factions.map((f) => json(`data/personas/${f.id}.json`).then((p) => [f.id, p]))));
  // the engine composed exactly as the server and the tests compose it: engine.js → attach-219.js (gates, RuntimeEvent
  // v1) → perception.js (DecisionContext, fillDecisions). Loaded as classic scripts, each layer attaches itself onto
  // window.EmperorsEngine; composing again here would wrap createGame/resolveTurn/fillDecisions twice.
  world.gatesPack = gates; world.charactersPack = characters; world.intelRules = intelRules;
  const Engine = window.EmperorsEngine;
  if (typeof Engine.projectPerception !== 'function' || typeof Engine.fillDecisions !== 'function') throw new Error('engine layers missing: engine.js → attach-219.js → perception.js');
  const colors = {}, glyphs = {};
  for (const f of world.factions) { colors[f.id] = f.color; glyphs[f.id] = personas[f.id].glyph || ''; }
  const seed = params.has('seed') ? Number(params.get('seed')) : undefined;
  const ctrl = GameController.create({ Engine, world, personas, seed });
  let loop = null;
  // the player UI reads only ctrl.view(): own realm exact, other factions through Engine.projectPerception
  const ui = DEMO ? null : PlayerUI.create({
    meta: world.meta, roster: ctrl.roster(), colors, actions: Engine.ACTIONS, bandText: GameController.BAND_TEXT,
    makeDecision: ctrl.decision, validate: ctrl.validate,
    onChoose: (fid) => loop.choose(fid), onSubmit: (d) => loop.submit(d).catch(fail), onSkip: () => presenter.skip(),
    onMark: (m) => { // a faction target lights its provinces on the public map
      if (m.faction) { const own = ctrl.owners(); m = { via: Object.keys(own).filter((pid) => own[pid] === m.faction) }; }
      hud.markPlaces(m); idle();
    },
  });
  window.__game = { Engine, ctrl, ui, world, ready: false };

  const rt = await WorldRuntime.create({ world, cities, width: W, height: H, dpr: Number(params.get('dpr')) || Math.min(1.5, devicePixelRatio || 1), base: 'assets/map/' });
  document.getElementById('loading').remove();
  const hud = WorldHud.create({ colors, glyphs, names: WorldNames });
  const presenter = EventPresenter.create(rt, { world, characters, names: WorldNames, hud });
  const seats = new Set(world.factions.map((f) => f.start.seat));
  hud.setPlaces(world.provinces.map((p) => { const s = rt.palaceOf(p.id); return { pid: p.id, text: p.city, seat: seats.has(p.id), at: [s[0], s[1] + 1.5, s[2]] }; }));
  const idle = () => { rt.render(); hud.drawPlaces(rt, rt.view().mode === 'far'); };
  const titleOf = (ev) => (ev.kind === 'gate' ? EventPresenter.GATE_TITLE[ev.id] : EventPresenter.KIND_TITLE[ev.kind]) || ev.kind;
  presenter.speed = Number(params.get('speed')) || (DEMO ? 1 : 2);
  hud.controls((s) => { presenter.speed = s; }, () => { if (!loop || !loop.playing) { presenter.end(); idle(); } }, presenter.speed);
  Object.assign(window.__game, { rt, presenter, hud, measure: () => rt.measure() });
  idle();
  if (DEMO) return WorldDemo.run({ rt, presenter, hud, world, gates, fixtures, params, idle, titleOf });

  loop = GameController.bind(ctrl, { rt, presenter, hud, ui, titleOf });
  window.__game.loop = loop;
  ui.ready();
  window.__game.ready = true;
})().catch(fail);
function fail(e) { console.error(e); window.__error = String((e && e.stack) || e); const l = document.getElementById('loading'); if (l) l.textContent = 'Lỗi: ' + e.message; }
</script>
</body></html>
