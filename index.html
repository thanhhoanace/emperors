<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tam Quốc Loạn Nhập — 3D Simulation</title>
  <style>
    :root {
      --bg: #071524;
      --bg-canvas: #071524;
      --panel: rgba(8, 24, 40, 0.94);
      --panel-solid: #081828;
      --border: #2b5272;
      --gold: #d8b45a;
      --gold-dim: #9b7a35;
      --text: #f7eed4;
      --text-dim: #c7b78c;
      --text-muted: #8aa0ad;
      --shadow: rgba(0, 0, 0, 0.5);
      --stat-bar-bg: #10283d;
      --event-border: rgba(216, 180, 90, 0.16);
      --hover-bg: rgba(216, 180, 90, 0.12);
      --selected-bg: rgba(35, 110, 166, 0.38);
      --btn-bg: transparent;
      --btn-hover-bg: #d4a843;
      --btn-hover-color: #0a0806;
      --eliminated-opacity: 0.4;
    }

    [data-theme="light"] {
      --bg: #efe4c8;
      --bg-canvas: #f3ead2;
      --panel: rgba(248, 238, 210, 0.9);
      --panel-solid: #f8eed2;
      --border: #b58e45;
      --gold: #9c6a1f;
      --gold-dim: #6d5225;
      --text: #1e2b28;
      --text-dim: #4d5745;
      --text-muted: #786749;
      --shadow: rgba(0, 0, 0, 0.15);
      --stat-bar-bg: #dfd0a9;
      --event-border: rgba(110, 82, 37, 0.18);
      --hover-bg: rgba(156, 106, 31, 0.12);
      --selected-bg: rgba(80, 160, 190, 0.28);
      --btn-bg: transparent;
      --btn-hover-bg: #b8962e;
      --btn-hover-color: #fdfbf7;
      --eliminated-opacity: 0.5;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: var(--bg); font-family: 'Noto Sans SC', sans-serif; color: var(--text); transition: background 0.3s, color 0.3s; }
    #canvas { display: block; width: 100vw; height: 100vh; background: var(--bg-canvas); }
    #ui { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 10; }
    .panel { pointer-events: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; color: var(--text); backdrop-filter: blur(8px); box-shadow: 0 10px 24px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.18); transition: background 0.3s, border-color 0.3s, color 0.3s; }
    .panel h3 { font-family: 'Noto Serif SC', serif; color: var(--gold); margin-bottom: 0.75rem; font-size: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    #topBar { position: absolute; top: 1rem; left: 50%; transform: translateX(-50%); display: flex; gap: 1rem; z-index: 20; flex-wrap: wrap; justify-content: center; }
    #topBar .panel { min-width: 180px; text-align: center; }
    #leftPanel { position: absolute; top: 5rem; left: 1rem; bottom: 1rem; width: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
    #rightPanel { position: absolute; top: 5rem; right: 1rem; bottom: 1rem; width: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
    .factionRow { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; border-radius: 4px; transition: background 0.2s; cursor: pointer; }
    .factionRow:hover { background: var(--hover-bg); }
    .factionRow.selected { background: var(--selected-bg); border: 1px solid var(--gold); }
    .factionColor { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .factionName { flex: 1; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .factionStats { font-size: 0.7rem; color: var(--text-dim); font-family: monospace; }
    .statBar { height: 4px; background: var(--stat-bar-bg); border-radius: 2px; overflow: hidden; margin: 2px 0; }
    .statBarFill { height: 100%; border-radius: 2px; transition: width 0.5s ease; }
    .eventLog { max-height: 300px; overflow-y: auto; font-size: 0.75rem; line-height: 1.5; }
    .eventEntry { padding: 0.25rem 0; border-bottom: 1px solid var(--event-border); display: flex; gap: 0.5rem; }
    .eventTime { color: var(--gold); font-family: monospace; flex-shrink: 0; }
    .eventText { color: var(--text); }
    .eventText.combat { color: #ef4444; }
    .eventText.diplomacy { color: #22c55e; }
    .eventText.subterfuge { color: #a855f7; }
    .eventText.internal { color: #3b82f6; }
    .legend { display: flex; flex-wrap: wrap; gap: 0.5rem; font-size: 0.7rem; }
    .legendItem { display: flex; align-items: center; gap: 0.25rem; }
    .legendColor { width: 10px; height: 10px; border-radius: 2px; }
    .speedControl { display: flex; align-items: center; gap: 0.5rem; }
    .speedControl input { flex: 1; accent-color: var(--gold); }
    .btn { padding: 0.4rem 1rem; border: 1px solid var(--gold); background: var(--btn-bg); color: var(--gold); border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 0.8rem; transition: all 0.2s; }
    .btn:hover { background: var(--btn-hover-bg); color: var(--btn-hover-color); }
    .btn.primary { background: var(--gold); color: var(--btn-hover-color); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .entityInfo { display: none; }
    .entityInfo.visible { display: block; animation: fadeIn 0.2s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 1200px) { #leftPanel, #rightPanel { display: none; } }
    .theme-toggle { padding: 0.3rem 0.6rem; font-size: 0.85rem; min-width: 44px; }
    .diplomacy-line { pointer-events: none; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div id="topBar">
      <div class="panel" style="min-width: 200px;">
        <div style="font-size: 0.75rem; color: var(--text-dim);">Năm <span id="yearDisplay" style="color:var(--gold);font-family:monospace">200</span> — Mùa <span id="seasonDisplay" style="color:var(--gold)">Xuân</span></div>
        <div style="font-size: 0.75rem; color: var(--text-dim); margin-top: 0.25rem;">Lượt: <span id="tickDisplay" style="color:var(--gold);font-family:monospace">0</span> — Tốc độ: <span id="speedDisplay">1.0x</span></div>
      </div>
      <div class="panel">
        <div class="speedControl" style="margin-top: 0.5rem;">
          <input type="range" id="speedSlider" min="0.1" max="5" step="0.1" value="1">
          <button id="pauseBtn" class="btn" style="padding: 0.3rem 0.75rem;">⏸ Tạm dừng</button>
          <button id="resetBtn" class="btn" style="padding: 0.3rem 0.75rem;">↺ Reset</button>
          <div style="display:flex; gap:0.25rem; margin-left:0.5rem; padding-left:0.5rem; border-left:1px solid var(--border);">
            <button id="zoomInBtn" class="btn" style="width:32px;height:32px;padding:0;font-size:14px;line-height:1" title="Zoom in">＋</button>
            <button id="zoomOutBtn" class="btn" style="width:32px;height:32px;padding:0;font-size:14px;line-height:1" title="Zoom out">−</button>
            <span id="zoomLevel" style="display:flex;align-items:center;padding:0 0.5rem;font-family:monospace;font-size:0.75rem;color:var(--text-dim)">100%</span>
          </div>
          <button id="themeBtn" class="btn theme-toggle" style="padding: 0.3rem 0.6rem;">🌙</button>
        </div>
      </div>
    </div>

    <div id="leftPanel">
      <div class="panel" style="flex: 1; display: flex; flex-direction: column;">
        <h3>Thế Lực</h3>
        <div id="factionList" style="flex: 1; overflow-y: auto;"></div>
      </div>
      <div class="panel">
        <h3>Nhật Ký</h3>
        <div id="eventLog" class="eventLog"></div>
      </div>
    </div>

    <div id="rightPanel">
      <div class="panel entityInfo" id="entityInfo">
        <h3 id="selectedName">Chọn một thế lực</h3>
        <div style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.5rem;" id="selectedType"></div>
        <div class="statBar" style="margin: 0.5rem 0;"><div class="statBarFill" id="barTroops" style="width: 0%; background: linear-gradient(90deg, #ef4444, #f87171);"></div></div>
        <div class="statBar" style="margin: 0.5rem 0;"><div class="statBarFill" id="barGrain" style="width: 0%; background: linear-gradient(90deg, #eab308, #facc15);"></div></div>
        <div class="statBar" style="margin: 0.5rem 0;"><div class="statBarFill" id="barLoyalty" style="width: 0%; background: linear-gradient(90deg, #3b82f6, #60a5fa);"></div></div>
        <div class="statBar" style="margin: 0.5rem 0;"><div class="statBarFill" id="barPrestige" style="width: 0%; background: linear-gradient(90deg, #a855f7, #c084fc);"></div></div>
        <div style="font-size: 0.75rem; color: var(--text-dim); margin-top: 0.5rem;" id="selectedQuote">—</div>
        <div style="margin-top: 0.75rem; font-size: 0.7rem; color: var(--gold);" id="selectedAction">Đang quan sát...</div>
      </div>
      <div class="panel">
        <h3>Chữ Thích</h3>
        <div class="legend" id="legend"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
    import { clone as cloneSkeleton } from 'three/addons/utils/SkeletonUtils.js';

    console.log('Three.js loaded:', THREE.REVISION);

    window.addEventListener('error', (e) => {
      console.error('Global error:', e.error);
      document.getElementById('canvas').style.display = 'none';
      const errDiv = document.createElement('div');
      errDiv.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1612;border:2px solid #ef4444;padding:2rem;color:#f5f0e8;font-family:monospace;z-index:9999;max-width:80%';
      errDiv.innerHTML = '<h3>Lỗi khởi tạo 3D</h3><pre>' + (e.error?.stack || e.message) + '</pre><button onclick="location.reload()" style="margin-top:1rem;padding:0.5rem 1rem;background:#d4a843;color:#0a0806;border:none;border-radius:4px;cursor:pointer">Tải lại</button>';
      document.body.appendChild(errDiv);
    });

    // ============================================
    // LOCAL ASSET MANIFEST - CC0 GLB + SVG textures
    // ============================================
    const ASSET_MANIFEST_URL = 'assets/manifest.json';
    const ASSET_MANIFEST_FALLBACK = {
      models: {
        treePine: { path: 'assets/models/nature/tree_cone.glb', scale: 0.08 },
        treePineDark: { path: 'assets/models/nature/tree_cone_dark.glb', scale: 0.08 },
        treeBroadleaf: { path: 'assets/models/nature/tree_default.glb', scale: 0.08 },
        treeBlock: { path: 'assets/models/nature/tree_blocks.glb', scale: 0.07 },
        treeFat: { path: 'assets/models/nature/tree_fat.glb', scale: 0.08 },
        bamboo: { path: 'assets/models/nature/crops_bambooStageB.glb', scale: 0.08 },
        brush: { path: 'assets/models/nature/plant_bushLarge.glb', scale: 0.075 },
        grassLarge: { path: 'assets/models/nature/grass_large.glb', scale: 0.08 },
        mountainTallA: { path: 'assets/models/nature/rock_tallA.glb', scale: 0.58 },
        mountainTallB: { path: 'assets/models/nature/rock_tallB.glb', scale: 0.62 },
        mountainLargeA: { path: 'assets/models/nature/rock_largeA.glb', scale: 0.72 },
        mountainCliffLarge: { path: 'assets/models/nature/cliff_large_rock.glb', scale: 0.62 },
        mountainCliff: { path: 'assets/models/nature/cliff_rock.glb', scale: 0.64 },
        roadBridge: { path: 'assets/models/roads/road-bridge.glb', scale: 0.18 },
      },
      textures: {
        grass: { path: 'assets/textures/terrain/grass.svg', repeat: [10, 10] },
        grassDark: { path: 'assets/textures/terrain/grass_dark.svg', repeat: [9, 9] },
        dirt: { path: 'assets/textures/terrain/dirt.svg', repeat: [8, 8] },
        rock: { path: 'assets/textures/terrain/rock.svg', repeat: [7, 7] },
        snow: { path: 'assets/textures/terrain/snow.svg', repeat: [11, 11] },
        sand: { path: 'assets/textures/terrain/sand.svg', repeat: [10, 10] },
        forest: { path: 'assets/textures/terrain/forest.svg', repeat: [8, 8] },
        mud: { path: 'assets/textures/terrain/mud.svg', repeat: [7, 7] },
        shore: { path: 'assets/textures/terrain/shore.svg', repeat: [12, 3] },
        waterBase: { path: 'assets/textures/water/water_base.svg', repeat: [12, 12] },
        waterNoise: { path: 'assets/textures/water/water_noise.svg', repeat: [16, 16] },
      },
    };

    const TERRAIN_TEXTURES = {
      grass: 'assets/textures/terrain/grass.svg',
      dirt: 'assets/textures/terrain/dirt.svg',
      rock: 'assets/textures/terrain/rock.svg',
      snow: 'assets/textures/terrain/snow.svg',
      sand: 'assets/textures/terrain/sand.svg',
      forest: 'assets/textures/terrain/forest.svg',
      grassDark: 'assets/textures/terrain/grass_dark.svg',
      mud: 'assets/textures/terrain/mud.svg',
    };

    // Texture tiling scales (world units per repeat)
    const TEXTURE_TILING = {
      grass: 30, grassDark: 25, dirt: 20, rock: 15,
      snow: 40, sand: 50, forest: 20, mud: 15
    };
    // Terrain height multiplier. Mountains need enough relief to read as ranges.
    const TERRAIN_HEIGHT_MULT = 1.15;

    // Scale factor for map coordinates to Three.js units.
    // FEATURE_SCALE keeps visual markers compact while MAP_SCALE spreads provinces out.
    const MAP_SCALE = 22;
    const FEATURE_SCALE = 16;

    class AssetManager {
      constructor(manifestUrl, fallbackManifest) {
        this.manifestUrl = manifestUrl;
        this.fallbackManifest = fallbackManifest;
        this.manifest = fallbackManifest;
        this.gltfLoader = new GLTFLoader();
        this.textureLoader = new THREE.TextureLoader();
        this.models = new Map();
        this.textures = new Map();
        this.failedAssets = [];
      }

      async preload() {
        if (window.location.protocol === 'file:') {
          console.warn('[AssetManager] file:// can block GLB/manifest loading. Use http://localhost:3000/ for full local asset rendering.');
        }

        try {
          const response = await fetch(this.manifestUrl, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          this.manifest = await response.json();
        } catch (error) {
          console.warn('[AssetManager] Failed to fetch assets/manifest.json; using embedded fallback manifest.', error);
          this.manifest = this.fallbackManifest;
        }

        const modelEntries = Object.entries(this.manifest.models || {});
        const textureEntries = Object.entries(this.manifest.textures || {});
        const tasks = [
          ...modelEntries.map(([id, entry]) => this.loadModelAsset(id, entry)),
          ...textureEntries.map(([id, entry]) => this.loadTextureAsset(id, entry)),
        ];
        await Promise.allSettled(tasks);

        if (this.failedAssets.length > 0) {
          console.warn('[AssetManager] Some assets failed and procedural fallback will be used:', this.failedAssets);
        } else {
          console.log(`[AssetManager] Loaded ${this.models.size} models and ${this.textures.size} textures.`);
        }
      }

      async loadModelAsset(id, entry) {
        try {
          const gltf = await this.gltfLoader.loadAsync(entry.path);
          this.normalizeModel(gltf.scene);
          this.models.set(id, gltf.scene);
        } catch (error) {
          this.failedAssets.push({ id, path: entry.path, type: 'model', error: error.message });
        }
      }

      async loadTextureAsset(id, entry) {
        try {
          const texture = await this.textureLoader.loadAsync(entry.path);
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.wrapS = THREE.RepeatWrapping;
          texture.wrapT = THREE.RepeatWrapping;
          if (Array.isArray(entry.repeat)) texture.repeat.set(entry.repeat[0], entry.repeat[1]);
          this.textures.set(id, texture);
        } catch (error) {
          this.failedAssets.push({ id, path: entry.path, type: 'texture', error: error.message });
        }
      }

      normalizeModel(root) {
        root.traverse(child => {
          if (!child.isMesh) return;
          child.castShadow = false;
          child.receiveShadow = false;
          if (Array.isArray(child.material)) {
            child.material = child.material.map(mat => this.normalizeMaterial(mat));
          } else if (child.material) {
            child.material = this.normalizeMaterial(child.material);
          }
        });
      }

      normalizeMaterial(material) {
        const cloned = material.clone();
        if ('roughness' in cloned) cloned.roughness = Math.max(cloned.roughness ?? 0.8, 0.78);
        if ('metalness' in cloned) cloned.metalness = Math.min(cloned.metalness ?? 0, 0.08);
        return cloned;
      }

      getTexture(id) {
        return this.textures.get(id) || null;
      }

      createModelInstance(id, options = {}) {
        const source = this.models.get(id);
        if (!source) return null;
        const entry = this.manifest.models?.[id] || {};
        const instance = cloneSkeleton(source);
        const scale = options.worldScale ?? ((options.scale ?? entry.scale ?? 1) * FEATURE_SCALE);

        if (Array.isArray(scale)) instance.scale.set(scale[0], scale[1], scale[2]);
        else instance.scale.setScalar(scale);

        if (options.position) instance.position.copy(options.position);
        if (typeof options.rotationY === 'number') instance.rotation.y = options.rotationY;

        if (options.tint) {
          const tint = new THREE.Color(options.tint);
          instance.traverse(child => {
            if (!child.isMesh || !child.material?.color) return;
            child.material = child.material.clone();
            child.material.color.lerp(tint, 0.35);
          });
        }

        return instance;
      }
    }

    const assetManager = new AssetManager(ASSET_MANIFEST_URL, ASSET_MANIFEST_FALLBACK);
    await assetManager.preload();

    // ============================================
    // EXPANDED GEOGRAPHY - Three Kingdoms + Neighbors
    // Covers: China proper, East Sea, Tibet, Mongolia, Southeast Asia
    // Coordinates in map units (1 unit ≈ 100km)
    // Origin near Luoyang, X=East, Z=South
    // ============================================
    // ============================================
    // EXPANDED PROVINCES - Three Kingdoms + Neighbors
    // ~30 provinces covering China + Neighbors
    // Coordinates expanded: X=East, Z=South, 1 unit ≈ 100km
    // Origin near Luoyang
    // ============================================
    const PROVINCES = [
      // === CHINA PROPER - Three Kingdoms Core ===
      // NORTH - Wei territory
      {id:'si_li', name:'Sili 司隸 (Lạc Dương 洛陽)', pos:[0, -0.5], neighbors:['ji','yu','jing','yi','henei'], strategic:true, terrain:'capital', capital:'Lạc Dương'},
      {id:'ji', name:'Jizhou 冀州 (Cơ - Dã 鄴)', pos:[-2.0, -3.5], neighbors:['si_li','qing','you','bing','henei','guangyang'], strategic:true, terrain:'plains', capital:'Dã 鄴'},
      {id:'qing', name:'Qingzhou 青州 (Thanh - Lâm Tú 臨淄)', pos:[-1.0, -4.5], neighbors:['ji','xu','beihai','donglai'], strategic:false, terrain:'coastal', capital:'Lâm Tú 臨淄'},
      {id:'yan', name:'Yanzhou 兗州 (Yển - Cổ Thành 鄄城)', pos:[-2.3, -2.0], neighbors:['xu','yu','ji','taishan'], strategic:false, terrain:'plains', capital:'Cổ Thành 鄄城'},
      {id:'yu', name:'Yuzhou 豫州 (Dư - Trần Lưu 陳留)', pos:[-0.8, -1.8], neighbors:['si_li','xu','yan','jing','yang','henei','ruannan'], strategic:true, terrain:'plains', capital:'Trần Lưu 陳留'},

      // CENTRAL
      {id:'xu', name:'Xuzhou 徐州 (Tự - Bằng昌 鄒平)', pos:[0.2, -2.8], neighbors:['qing','yu','yan','taishan','pengcheng'], strategic:true, terrain:'plains', capital:'Bằng昌 鄒平'},

      // WEST - Shu/Liang
      {id:'yi', name:'Yizhou 益州 (Ích - Thành Đô 成都)', pos:[3.8, 0.8], neighbors:['si_li','jing','liang','ba','hanzhong','yuexi'], strategic:true, terrain:'basin', capital:'Thành Đô 成都'},
      {id:'liang', name:'Liangzhou 凉州 (Lương - Trương An 長安)', pos:[2.2, -2.2], neighbors:['yi','si_li','bing','hanzhong','wudu','jinyang'], strategic:true, terrain:'mountains', capital:'Trương An 長安'},
      {id:'bing', name:'Bingzhou 并州 (Bình - Thái Nguyên 太原)', pos:[1.2, -3.8], neighbors:['ji','liang','yanmen','shuofang'], strategic:false, terrain:'mountains', capital:'Thái Nguyên 太原'},

      // SOUTH - Wu territory
      {id:'jing', name:'Jingzhou 荊州 (Tinh - Tương Dương 襄陽)', pos:[1.8, 1.5], neighbors:['si_li','yu','yang','yi','jiao','jiang','ruannan','hanzhong'], strategic:true, terrain:'riverlands', capital:'Tương Dương 襄陽'},
      {id:'yang', name:'Yangzhou 揚州 (Dương - Kiến Nghiệp 建業)', pos:[3.2, 1.2], neighbors:['yu','jing','jiao','jiang','kuaiji','danyang'], strategic:true, terrain:'riverlands', capital:'Kiến Nghiệp 建業'},
      {id:'jiang', name:'Jiangzhou 江州 (Giang - Quảng Lăng 廣陵)', pos:[4.0, 1.8], neighbors:['jing','yang','jiao','po yang','luling'], strategic:false, terrain:'coastal', capital:'Quảng Lăng 廣陵'},
      {id:'jiao', name:'Jiaozhou 交州 (Giao - Phiên Ngung 番禺)', pos:[4.5, 4.2], neighbors:['jing','yang','jiang','nanhai','cangwu'], strategic:false, terrain:'tropical', capital:'Phiên Ngung 番禺'},

      // NORTHERN FRONTIER
      {id:'you', name:'Youzhou 幽州 (Du - Cửu Châu 薊)', pos:[-2.8, -5.0], neighbors:['ji','bing','liaoxi','guangyang'], strategic:false, terrain:'steppes', capital:'Cửu Châu 薊'},

      const data = imageData.data;
      
      for (let i = 0; i < size * size; i++) {
        const x = (i % size) / size;
        const y = Math.floor(i / size) / size;
        const noise = (Math.sin(x * 20) * Math.cos(y * 20) + Math.sin(x * 50) * Math.cos(y * 50) * 0.3) * 0.5;
        const r = Math.floor((color.r + noise) * 255);
        const g = Math.floor((color.g + noise) * 255);
        const b = Math.floor((color.b + noise) * 255);
        data[i * 4] = r;
        data[i * 4 + 1] = g;
        data[i * 4 + 2] = b;
        data[i * 4 + 3] = 255;
      }
      ctx.putImageData(imageData, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = true;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function configureTerrainTexture(texture, repeat = 1) {
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.generateMipmaps = true;
      texture.repeat.set(repeat, repeat);
	      if (renderer?.capabilities?.getMaxAnisotropy) {
	        texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
	      }
	      const image = texture.image;
	      const hasImageData = image && (image.data || image.width || image.videoWidth || image.complete);
	      if (hasImageData) texture.needsUpdate = true;
	    }
    
    const fallbackColors = {
      grass: new THREE.Color(0x78a844), grassDark: new THREE.Color(0x456f35),
      dirt: new THREE.Color(0xa6743e), rock: new THREE.Color(0x8c7f70),
      snow: new THREE.Color(0xf1eee2), sand: new THREE.Color(0xd7b86f),
      forest: new THREE.Color(0x2f7c42), mud: new THREE.Color(0x7a5a35),
    };
    
    for (const key of textureKeys) {
      // Try CDN first, fallback to procedural
      const url = TERRAIN_TEXTURES[key];
      if (url) {
        const tex = textureLoader.load(url,
          (loadedTex) => {
            loadedTex.colorSpace = THREE.SRGBColorSpace;
            const tile = TEXTURE_TILING[key] || 30;
            configureTerrainTexture(loadedTex, tile);
            terrainTextures[key] = loadedTex;
          },
          undefined,
          (err) => {
            console.warn(`Failed to load texture ${key}, using fallback`);
            const fallbackTex = createFallbackTexture(fallbackColors[key]);
            configureTerrainTexture(fallbackTex, TEXTURE_TILING[key] || 30);
            terrainTextures[key] = fallbackTex;
          }
        );
        terrainTextures[key] = tex;
      } else {
        const fallbackTex = createFallbackTexture(fallbackColors[key]);
        configureTerrainTexture(fallbackTex, TEXTURE_TILING[key] || 30);
        terrainTextures[key] = fallbackTex;
      }
    }

    // Generate procedural splat map (RGBA channels = different terrain types)
    function generateSplatMap(width = 1024, height = 1024) {
      const data = new Uint8Array(width * height * 4);
      for (let i = 0; i < width * height; i++) {
        const x = (i % width) / width;
        const z = Math.floor(i / width) / height;
        const mx = x * 200 - 100; // Map to world coords
        const mz = z * 200 - 100;
        
        // Determine biome at this position
        let minDist = Infinity;
        let baseTerrain = 'plains';
        let moisture = 0.5;
        let temp = 1.0;
        
        for (const prov of PROVINCES) {
          const d = Math.sqrt((mx / MAP_SCALE - prov.pos[0]) ** 2 + (mz / MAP_SCALE - prov.pos[1]) ** 2);
          if (d < minDist) {
            minDist = d;
            baseTerrain = prov.terrain || 'plains';
          }
        }
        
        // Simplified biome assignment
        // R: grass/grassDark, G: dirt/mud, B: rock/snow, A: sand/forest
        let r = 0, g = 0, b = 0, a = 0;
        
        switch(baseTerrain) {
          case 'plains': r = 255; g = 50; break;
          case 'capital': r = 200; g = 100; break;
          case 'riverlands': r = 100; g = 100; b = 50; break;
          case 'coastal': r = 50; g = 200; a = 50; break;
          case 'tropical': r = 150; g = 50; a = 100; break;
          case 'mountains': g = 100; b = 200; break;
          case 'steppes': r = 150; g = 150; g = 50; break;
          case 'basin': r = 180; g = 80; break;
          case 'desert': r = 200; g = 150; a = 50; break;
          default: r = 200; g = 100;
        }
        
        // Add some noise for natural transitions
        const noise = (Math.sin(x * 10) * Math.cos(z * 10)) * 30;
        r = Math.max(0, Math.min(255, r + noise));
        g = Math.max(0, Math.min(255, g + noise));
        b = Math.max(0, Math.min(255, b + noise));
        a = Math.max(0, Math.min(255, a + noise));
        
        data[i * 4] = r;
        data[i * 4 + 1] = g;
        data[i * 4 + 2] = b;
        data[i * 4 + 3] = a;
      }
      
      const splatMap = new THREE.DataTexture(data, width, height, THREE.RGBAFormat, THREE.UnsignedByteType);
      splatMap.needsUpdate = true;
      return splatMap;
    }

    const splatMap = generateSplatMap(512, 512);
    const terrainVertexShader = `
      varying vec2 vUv;
      varying vec3 vWorldPosition;
      varying float vElevation;
      
      uniform float uDisplacementScale;
      
      void main() {
        vUv = uv;
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vWorldPosition = worldPos.xyz;
        
        // Displacement in vertex shader for better performance
        float elev = position.y;
        vElevation = elev;
        
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `;

    const terrainFragmentShader = `
      varying vec2 vUv;
      varying vec3 vWorldPosition;
      varying float vElevation;
      
      uniform vec3 uColorLow;      // Sea level
      uniform vec3 uColorCoast;    // Coastal
      uniform vec3 uColorPlains;   // Plains
      uniform vec3 uColorRiver;    // Riverlands
      uniform vec3 uColorHills;    // Hills
      uniform vec3 uColorMountain; // Mountains
      uniform vec3 uColorPeak;     // High peaks / snow
      uniform vec3 uColorSteppe;   // Steppes
      uniform vec3 uColorTropical; // Tropical
      uniform vec3 uColorDesert;   // Desert
      uniform vec3 uFogColor;
      uniform float uFogNear;
      uniform float uFogFar;
      uniform vec3 uCameraPos;
      uniform sampler2D uSplatMap;
      uniform sampler2D uTexGrass;
      uniform sampler2D uTexGrassDark;
      uniform sampler2D uTexDirt;
      uniform sampler2D uTexRock;
      uniform sampler2D uTexSnow;
      uniform sampler2D uTexSand;
      uniform sampler2D uTexForest;
      uniform sampler2D uTexMud;
      
      // Noise functions
      vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }
      
      float snoise(vec2 v) {
        const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 1.0);
        vec2 i  = floor(v + dot(v, C.yy));
        vec2 x0 = v - i + dot(i, C.xx);
        vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
        vec4 x12 = x0.xyxy + C.xxzz;
        x12.xy -= i1;
        i = mod289(i);
        vec3 p = permute(permute(i.x + vec3(0.0, i1.x, 1.0)) + i.y + vec3(0.0, i1.y, 1.0));
        
        vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
        m = m*m;
        m = m*m;
        vec3 x = 2.0 * fract(p * C.www) - 1.0;
        vec3 h = abs(x) - 0.5;
        vec3 ox = floor(x + 0.5);
        vec3 a0 = x - ox;
        m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
        
        vec3 g;
        g.x  = a0.x  * x0.x  + h.x  * x0.y;
        g.yz = a0.yz * x12.xz + h.yz * x12.yw;
        return 130.0 * dot(m, g);
      }
      
      float fbm(vec2 p) {
        float f = 0.0;
        float a = 0.5;
        for(int i=0; i<5; i++) {
          f += a * snoise(p);
          p *= 2.0;
          a *= 0.5;
        }
        return f;
      }
      
      void main() {
        float elev = vElevation;
        vec3 baseColor;
        
        // Biome selection based on elevation and moisture (world position)
        float moisture = 0.5 + 0.3 * sin(vWorldPosition.x * 0.5) * cos(vWorldPosition.z * 0.5);
        float temp = 1.0 - abs(vWorldPosition.z * 0.1) - vWorldPosition.y * 10.0;
        
        // Color blending based on elevation zones
        if (elev < -0.3) {
          // Ocean
          baseColor = mix(uColorLow, uColorCoast, smoothstep(-0.8, -0.3, elev));
        } else if (elev < 0.0) {
          // River / wetland
          float riverFactor = smoothstep(-0.3, 0.0, elev);
          baseColor = mix(uColorRiver, uColorCoast, riverFactor);
        } else if (elev < 0.15) {
          // Plains / lowlands
          float plainsFactor = smoothstep(0.0, 0.15, elev);
          if (moisture > 0.6) {
            baseColor = mix(uColorRiver, uColorPlains, plainsFactor);
          } else if (temp > 0.7 && vWorldPosition.z > 3.0) {
            baseColor = mix(uColorTropical, uColorPlains, plainsFactor);
          } else if (temp < 0.3 && vWorldPosition.z < -3.0) {
            baseColor = mix(uColorSteppe, uColorPlains, plainsFactor);
          } else {
            baseColor = uColorPlains;
          }
        } else if (elev < 0.4) {
          // Hills
          float hillFactor = smoothstep(0.15, 0.4, elev);
          if (temp < 0.3) baseColor = mix(uColorSteppe, uColorHills, hillFactor);
          else if (temp > 0.7) baseColor = mix(uColorTropical, uColorHills, hillFactor);
          else baseColor = uColorHills;
        } else if (elev < 0.8) {
          // Mountains
          float mtnFactor = smoothstep(0.4, 0.8, elev);
          baseColor = mix(uColorHills, uColorMountain, mtnFactor);
        } else {
          // High peaks / snow
          float peakFactor = smoothstep(0.8, 1.2, elev);
          baseColor = mix(uColorMountain, uColorPeak, peakFactor);
        }
      
      // Texture splatting from splat map
      vec4 splat = texture2D(uSplatMap, vUv);
      
      // Sample all terrain textures
      vec4 texGrass = texture2D(uTexGrass, vUv);
      vec4 texGrassDark = texture2D(uTexGrassDark, vUv);
      vec4 texDirt = texture2D(uTexDirt, vUv);
      vec4 texRock = texture2D(uTexRock, vUv);
      vec4 texSnow = texture2D(uTexSnow, vUv);
      vec4 texSand = texture2D(uTexSand, vUv);
      vec4 texForest = texture2D(uTexForest, vUv);
      vec4 texMud = texture2D(uTexMud, vUv);
      
      // Blend based on splat map channels
      // R: grass/grassDark, G: dirt/mud, B: rock/snow, A: sand/forest
      vec3 textureColor = vec3(0.0);
      textureColor += mix(texGrass.rgb, texGrassDark.rgb, 0.35) * splat.r;
      textureColor += mix(texDirt.rgb, texMud.rgb, 0.3) * splat.g;
      textureColor += mix(texRock.rgb, texSnow.rgb, 0.3) * splat.b;
      textureColor += mix(texSand.rgb, texForest.rgb, 0.5) * splat.a;
      
      // Add detail noise
      float detail = fbm(vUv * 24.0) * 0.015;
      vec3 color = mix(baseColor, textureColor, 0.48) + detail;
      color = mix(vec3(dot(color, vec3(0.299, 0.587, 0.114))), color, 1.18);
      color = pow(max(color, vec3(0.0)), vec3(0.88));
      
      // Distance fog
      float dist = distance(vWorldPosition, uCameraPos);
      float fogFactor = smoothstep(uFogNear, uFogFar, dist);
      
      // Apply fog
      vec3 finalColor = mix(color, uFogColor, fogFactor);
      
      // Very subtle elevation hint (flat map style)
      finalColor *= 0.98 + vElevation * 0.05;
      
      gl_FragColor = vec4(finalColor, 1.0);
    }
  `;

    // ============================================
    // THREE.JS SETUP
    // ============================================
    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    const INITIAL_CANVAS_COLOR = 0xf3ead2;
    const INITIAL_FOG_COLOR = 0xe7dac2;
    renderer.toneMapping = THREE.LinearToneMapping;
    renderer.toneMappingExposure = 1.2;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(INITIAL_CANVAS_COLOR);
    renderer.setClearColor(INITIAL_CANVAS_COLOR);
    scene.fog = new THREE.FogExp2(INITIAL_FOG_COLOR, 0.0024);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.5, 1000);
    camera.position.set(0, 150, 135);
    camera.lookAt(0, 0, 0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 70;
    controls.maxDistance = 700;
    controls.minPolarAngle = 0.18;
    controls.maxPolarAngle = Math.PI / 2 - 0.45;
    controls.target.set(0, 0, 0);
    controls.enablePan = true;
    controls.zoomSpeed = 1.2;
    controls.panSpeed = 0.8;
    controls.rotateSpeed = 0.7;

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);

    // ============================================
    // ENVIRONMENT - Flat map style (no HDRI reflections)
    // ============================================
    // Disabled HDRI to eliminate shadow/reflection artifacts on map surfaces
    // scene.environment = null; (default)

    // Soft map lighting with enough direction for mountains to read.
    const ambientLight = new THREE.AmbientLight(0xfff8f0, 1.25);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xffeedd, 0xaabb99, 0.5);
    hemiLight.position.set(0, 50, 0);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff5e6, 0.42);
    sunLight.position.set(10, 80, 10);
    scene.add(sunLight);

    // Fill light from opposite side to avoid harsh shadow blocks.
    const fillLight = new THREE.DirectionalLight(0xe8f0ff, 0.16);
    fillLight.position.set(-10, 40, -10);
    scene.add(fillLight);

    // ============================================
    // PROCEDURAL HEIGHTMAP GENERATION
    // ============================================
    const groundSize = 800;
    const groundSegments = 200; // High resolution for displacement
    const groundGeo = new THREE.PlaneGeometry(groundSize, groundSize, groundSegments, groundSegments);
    
    const posAttr = groundGeo.getAttribute('position');
    const elevations = new Float32Array(posAttr.count);
    
    // Precompute geographic features for heightmap
    const provincePositions = PROVINCES.map(p => ({ x: p.pos[0], z: p.pos[1], terrain: p.terrain, strategic: p.strategic }));
    const riverSegments = [];
    RIVERS.forEach(river => {
      for (let i = 0; i < river.path.length - 1; i++) {
        riverSegments.push({ p1: river.path[i], p2: river.path[i+1], width: river.width });
      }
    });
    const mountainPeaks = [];
    MOUNTAINS.forEach(mtn => mtn.peaks.forEach(peak => mountainPeaks.push({ x: peak[0], z: peak[1] })));
    const passPositions = STRATEGIC_PASSES.map(p => ({ x: p.pos[0], z: p.pos[1] }));

    for (let i = 0; i < posAttr.count; i++) {
      const x = posAttr.getX(i);
      const z = posAttr.getY(i);
      const mx = x / MAP_SCALE;
      const mz = z / MAP_SCALE;
      
      let minDist = Infinity;
      let baseTerrain = 'plains';
      let isStrategic = false;
      provincePositions.forEach(prov => {
        const d = Math.sqrt((mx - prov.x) ** 2 + (mz - prov.z) ** 2);
        if (d < minDist) { minDist = d; baseTerrain = prov.terrain || 'plains'; isStrategic = prov.strategic; }
      });
      
      let distToRiver = Infinity;
      riverSegments.forEach(seg => {
        const dx = seg.p2[0] - seg.p1[0];
        const dz = seg.p2[1] - seg.p1[1];
        const len2 = dx * dx + dz * dz;
        if (len2 > 0) {
          const t = Math.max(0, Math.min(1, ((mx - seg.p1[0]) * dx + (mz - seg.p1[1]) * dz) / len2));
          const projX = seg.p1[0] + t * dx;
          const projZ = seg.p1[1] + t * dz;
          const d = Math.sqrt((mx - projX) ** 2 + (mz - projZ) ** 2);
          distToRiver = Math.min(distToRiver, d);
        }
      });
      
      let distToMountain = Infinity;
      mountainPeaks.forEach(peak => { distToMountain = Math.min(distToMountain, Math.sqrt((mx - peak.x) ** 2 + (mz - peak.z) ** 2)); });
      
      let distToPass = Infinity;
      passPositions.forEach(pass => { distToPass = Math.min(distToPass, Math.sqrt((mx - pass.x) ** 2 + (mz - pass.z) ** 2)); });
      
      let distToCoast = Infinity;
      for (let j = 0; j < COASTLINE.length; j += 2) {
        if (j + 1 < COASTLINE.length) {
          const cx = COASTLINE[j];
          const cz = COASTLINE[j + 1];
          const d = Math.sqrt((mx - cx) ** 2 + (mz - cz) ** 2);
          distToCoast = Math.min(distToCoast, d);
        }
      }
      
      const isOcean = distToCoast > 1.2 && (mx > 4.5 || mz > 4.0 || mx < -3.0 || mz < -5.5);
      const isPass = distToPass < 0.3;
      
      let elevation = 0;
      
      if (isOcean) {
        elevation = -0.6;
      } else if (distToRiver < 0.2) {
        elevation = -0.15 + distToRiver * 0.25; // River channels
      } else if (isPass) {
        elevation = 0.1; // Passes are slightly elevated but flat
      } else if (distToMountain < 0.9) {
        const mtnFactor = Math.min(1, (0.9 - distToMountain) / 0.9);
        elevation = 0.2 + mtnFactor * 1.8;
        // Add mountain ridge detail
        const ridge = Math.sin((mx + mz) * 8) * 0.1 * mtnFactor;
        elevation += ridge;
      } else if (distToCoast < 0.4) {
        elevation = distToCoast * 0.15;
      } else {
        switch(baseTerrain) {
          case 'capital': elevation = isStrategic ? 0.12 : 0.08; break;
          case 'plains': elevation = 0.05; break;
          case 'riverlands': elevation = 0.0; break;
          case 'basin': elevation = 0.08; break;
          case 'coastal': elevation = 0.03; break;
          case 'tropical': elevation = 0.08; break;
          case 'steppes': elevation = 0.12; break;
          case 'mountains': elevation = 0.5; break;
          case 'desert': elevation = 0.2; break;
          default: elevation = 0.05;
        }
        if (isStrategic) elevation += 0.05;
      }
      
      // Noise
      const noise = (Math.sin(mx * 1.2) * Math.cos(mz * 1.2) + Math.sin(mx * 4) * Math.cos(mz * 4) * 0.3 + Math.sin(mx * 12) * Math.cos(mz * 12) * 0.1) * 0.025;
      elevation += noise;
      
      elevations[i] = elevation * TERRAIN_HEIGHT_MULT;
    }
    
    // Displace vertices
    const posArray = posAttr.array;
    for (let i = 0; i < posAttr.count; i++) {
      posArray[i * 3 + 1] = elevations[i];
    }
    groundGeo.computeVertexNormals();
    
    // ============================================
    // TERRAIN MATERIAL WITH CUSTOM SHADER
    // ============================================
    const terrainUniforms = {
      uDisplacementScale: { value: 1.0 },
      uColorLow:      { value: new THREE.Color(0x235f87) },  // Deep water
      uColorCoast:    { value: new THREE.Color(0x78b8b0) },  // Shallow water
      uColorPlains:   { value: new THREE.Color(0x95bd58) },  // Saturated Civ-like plains
      uColorRiver:    { value: new THREE.Color(0x55a783) },  // Wet river lands
      uColorHills:    { value: new THREE.Color(0xb58b45) },  // Dry hills
      uColorMountain: { value: new THREE.Color(0x7f6656) },  // Mountains
      uColorPeak:     { value: new THREE.Color(0xf3f1e0) },  // Snow peaks
      uColorSteppe:   { value: new THREE.Color(0xcaa866) },  // Steppes
      uColorTropical: { value: new THREE.Color(0x2f8f4e) },  // Tropical
      uColorDesert:   { value: new THREE.Color(0xd7b16c) },  // Desert
      uFogColor:      { value: new THREE.Color(INITIAL_FOG_COLOR) },
      uFogNear:       { value: 170.0 },
      uFogFar:        { value: 760.0 },
      uCameraPos:     { value: camera.position },
      // Texture splatting
      uSplatMap:      { value: splatMap },
      uTexGrass:      { value: terrainTextures.grass },
      uTexGrassDark:  { value: terrainTextures.grassDark },
      uTexDirt:       { value: terrainTextures.dirt },
      uTexRock:       { value: terrainTextures.rock },
      uTexSnow:       { value: terrainTextures.snow },
      uTexSand:       { value: terrainTextures.sand },
      uTexForest:     { value: terrainTextures.forest },
      uTexMud:        { value: terrainTextures.mud },
    };

    const terrainMaterial = new THREE.ShaderMaterial({
      vertexShader: terrainVertexShader,
      fragmentShader: terrainFragmentShader,
      uniforms: terrainUniforms,
    });

    const terrainMesh = new THREE.Mesh(groundGeo, terrainMaterial);
    terrainMesh.rotation.x = -Math.PI/2;
    scene.add(terrainMesh);

    // Subtle underlay only; keep it low/quiet so it does not expose the map's base at oblique zoom levels.
    const oceanGeo = new THREE.PlaneGeometry(groundSize, groundSize);
    const oceanMat = new THREE.MeshBasicMaterial({ 
      color: 0x0d1b2a, 
      transparent: true, 
      opacity: 0.08, 
      depthWrite: false 
    });
    const ocean = new THREE.Mesh(oceanGeo, oceanMat);
    ocean.rotation.x = -Math.PI/2;
    ocean.position.y = -2.4;
    ocean.renderOrder = -10;
    ocean.visible = false;
    scene.add(ocean);

    // ============================================
    // RIVERS - Enhanced map-style with natural channels and shore blending
    // ============================================
    const riverGroup = new THREE.Group();
    scene.add(riverGroup);

    function createRiverRibbon(path, width, color, options = {}) {
      if (path.length < 2) return null;
      const points = path.map(pt => new THREE.Vector3(pt[0] * MAP_SCALE, options.y ?? 0.12, pt[1] * MAP_SCALE));
      const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.5);
      const segments = points.length * 8;
      const curvePoints = curve.getPoints(segments);
      const ribbonWidth = width * FEATURE_SCALE * 0.18;
      const positions = [];
      const uvs = [];
      const indices = [];
      for (let i = 0; i < curvePoints.length; i++) {
        const p = curvePoints[i];
        let tangent;
        if (i < curvePoints.length - 1) tangent = curvePoints[i+1].clone().sub(p).normalize();
        else tangent = p.clone().sub(curvePoints[i-1]).normalize();
        const normal = new THREE.Vector3(-tangent.z, 0, tangent.x);
        
        // Variable width for natural river appearance (narrower at source, wider at mouth)
        const progress = i / (curvePoints.length - 1);
        const widthMult = 0.7 + progress * 0.6; // 70% at source, 130% at mouth
        const w = ribbonWidth * widthMult * (options.widthMult ?? 1.0);
        
        positions.push(p.x + normal.x * w, p.y, p.z + normal.z * w);
        positions.push(p.x - normal.x * w, p.y, p.z - normal.z * w);
        uvs.push(i / curvePoints.length * 8, 0, i / curvePoints.length * 8, 1);
        if (i < curvePoints.length - 1) {
          const base = i * 2;
          indices.push(base, base+1, base+2, base+1, base+3, base+2);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      const map = options.textureId ? assetManager.getTexture(options.textureId) : null;
      const mat = new THREE.MeshBasicMaterial({
        color,
        map,
        transparent: true,
        opacity: options.opacity ?? 0.72,
        side: THREE.DoubleSide,
        depthWrite: false,
        depthTest: false
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.renderOrder = options.renderOrder ?? 2;
      return mesh;
    }

    function createRiverShore(path, width, options = {}) {
      // Creates a wet shore/sand bank transition
      if (path.length < 2) return null;
      const points = path.map(pt => new THREE.Vector3(pt[0] * MAP_SCALE, options.y ?? 0.11, pt[1] * MAP_SCALE));
      const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.5);
      const segments = points.length * 8;
      const curvePoints = curve.getPoints(segments);
      const ribbonWidth = width * FEATURE_SCALE * 0.28; // Wider than water
      const positions = [];
      const indices = [];
      for (let i = 0; i < curvePoints.length; i++) {
        const p = curvePoints[i];
        let tangent;
        if (i < curvePoints.length - 1) tangent = curvePoints[i+1].clone().sub(p).normalize();
        else tangent = p.clone().sub(curvePoints[i-1]).normalize();
        const normal = new THREE.Vector3(-tangent.z, 0, tangent.x);
        
        const progress = i / (curvePoints.length - 1);
        const widthMult = 0.8 + progress * 0.5;
        const w = ribbonWidth * widthMult;
        
        positions.push(p.x + normal.x * w, p.y, p.z + normal.z * w);
        positions.push(p.x - normal.x * w, p.y, p.z - normal.z * w);
        if (i < curvePoints.length - 1) {
          const base = i * 2;
          indices.push(base, base+1, base+2, base+1, base+3, base+2);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      const mat = new THREE.MeshBasicMaterial({
        color: 0xcbd7bd,
        transparent: true,
        opacity: 0.25,
        side: THREE.DoubleSide,
        depthWrite: false,
        depthTest: false
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.renderOrder = 1;
      return mesh;
    }

    RIVERS.forEach(river => {
      // Main water ribbon
      const ribbon = createRiverRibbon(river.path, river.width, river.color, {
        y: 0.14,
        opacity: 0.85,
        textureId: 'waterBase',
        renderOrder: 2,
      });
      if (ribbon) riverGroup.add(ribbon);

      // Shore transition (wet sand/mud bank)
      const shore = createRiverShore(river.path, river.width * 1.35, {
        y: 0.115,
      });
      if (shore) riverGroup.add(shore);

      // Subtle water noise overlay for flow sense
      const noiseRibbon = createRiverRibbon(river.path, river.width * 0.85, 0x8ab4d8, {
        y: 0.155,
        opacity: 0.12,
        textureId: 'waterNoise',
        renderOrder: 3,
      });
      if (noiseRibbon) riverGroup.add(noiseRibbon);

      // River label
      const midPt = river.path[Math.floor(river.path.length / 2)];

      labelDiv.style.cssText = 'color:#7a9ab0;font-size:10px;font-weight:500;font-style:italic;text-shadow:0 0 3px rgba(0,0,0,0.5);pointer-events:none;white-space:nowrap;';
      labelDiv.textContent = river.name;
      const label = new CSS2DObject(labelDiv);
      label.position.set(midPt[0] * MAP_SCALE, 0.4, midPt[1] * MAP_SCALE);
      scene.add(label);
    });    // ============================================
    // HISTORICAL ROADS - Enhanced map-style with texture and terrain following
    // ============================================
    const roadGroup = new THREE.Group();
    scene.add(roadGroup);

    function createRoadRibbon(path, width, y, color, opacity, options = {}) {
      if (path.length < 2) return null;
      const points = path.map(pt => new THREE.Vector3(pt[0] * MAP_SCALE, y, pt[1] * MAP_SCALE));
      const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.5);
      const curvePoints = curve.getPoints(path.length * 16); // More segments for smooth curves
      const halfWidth = width * FEATURE_SCALE * 0.5;
      const positions = [];
      const uvs = [];
      const indices = [];

      for (let i = 0; i < curvePoints.length; i++) {
        const p = curvePoints[i];
        let tangent;
        if (i < curvePoints.length - 1) tangent = curvePoints[i + 1].clone().sub(p).normalize();
        else tangent = p.clone().sub(curvePoints[i - 1]).normalize();
        const normal = new THREE.Vector3(-tangent.z, 0, tangent.x);
        
        // Slight width variation for natural feel
        const progress = i / (curvePoints.length - 1);
        const w = halfWidth * (0.95 + Math.sin(progress * Math.PI * 4) * 0.05);
        
        positions.push(p.x + normal.x * w, p.y, p.z + normal.z * w);
        positions.push(p.x - normal.x * w, p.y, p.z - normal.z * w);
        uvs.push(i / curvePoints.length * 12, 0, i / curvePoints.length * 12, 1);
        if (i < curvePoints.length - 1) {
          const base = i * 2;
          indices.push(base, base + 1, base + 2, base + 1, base + 3, base + 2);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      
      const map = options.textureId ? assetManager.getTexture(options.textureId) : null;
      const mat = new THREE.MeshBasicMaterial({
        color,
        map,
        transparent: true,
        opacity,
        side: THREE.DoubleSide,
        depthWrite: false,
        depthTest: false,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.renderOrder = 2;
      return mesh;
    }

    HISTORICAL_ROADS.forEach(road => {
      if (road.path.length < 2) return;
      const isMajor = road.type === 'major';
      
      // Road edge (darker border)
      const edge = createRoadRibbon(road.path, isMajor ? 0.38 : 0.26, 0.22, 0x5a3d1c, isMajor ? 0.4 : 0.28);
      // Road fill (lighter center)
      const fill = createRoadRibbon(road.path, isMajor ? 0.24 : 0.14, 0.25, isMajor ? 0xd9b46f : 0xb8905f, isMajor ? 0.9 : 0.65, {

      });
      // Center line for major roads (subtle)
      const center = isMajor ? createRoadRibbon(road.path, 0.08, 0.28, 0xf5e6c8, 0.35) : null;
      
      if (edge) { edge.userData = { roadType: road.type, roadLayer: 'edge' }; roadGroup.add(edge); }
      if (fill) { fill.userData = { roadType: road.type, roadLayer: 'fill' }; roadGroup.add(fill); }
      if (center) { center.userData = { roadType: road.type, roadLayer: 'center' }; roadGroup.add(center); }
      
      // Road label for major roads only
      if (isMajor) {
        const midIdx = Math.floor(road.path.length / 2);
        const midPt = road.path[midIdx];
        const labelDiv = document.createElement('div');
        labelDiv.style.cssText = 'color:#6f4d2c;font-size:9px;font-weight:700;font-style:italic;text-shadow:0 1px 2px rgba(255,255,255,0.9),0 0 3px rgba(0,0,0,0.25);pointer-events:none;white-space:nowrap;';
        labelDiv.textContent = road.name;
        const label = new CSS2DObject(labelDiv);
        label.position.set(midPt[0] * MAP_SCALE, 0.5, midPt[1] * MAP_SCALE);
        scene.add(label);
