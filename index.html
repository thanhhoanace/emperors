    });    // ============================================
    // MOUNTAINS - Civ-like terrain ranges with ridges, color banding, foothills
    // ============================================
    const mountainGroup = new THREE.Group();
    scene.add(mountainGroup);

    function deterministicNoise(seed) {
      const value = Math.sin(seed * 12.9898) * 43758.5453;
      return value - Math.floor(value);
    }

    // Color banding for mountain elevation zones
    function getMountainColor(mtnColor, elevationRatio) {
      const base = new THREE.Color(mtnColor);
      if (elevationRatio < 0.25) {
        // Foothills - warmer, earthier
        return base.clone().multiplyScalar(0.85).lerp(new THREE.Color(0x8b7355), 0.3);
      } else if (elevationRatio < 0.55) {
        // Mid-slope - darker rock
        return base.clone().multiplyScalar(0.72);
      } else if (elevationRatio < 0.8) {
        // Upper slope - ridge color
        return base.clone().multiplyScalar(1.04);
      } else {
        // Snow cap
        return new THREE.Color(0xf3efe2);
      }
    }

    function createMountainPeakMesh(radius, height, mtnColor, seed) {
      const group = new THREE.Group();
      
      // Multi-layer peak with color banding
      const layers = 4;
      for (let layer = 0; layer < layers; layer++) {
        const layerRatio = layer / (layers - 1);
        const layerHeight = height / layers;
        const layerRadius = radius * (1 - layerRatio * 0.65);
        const layerY = layer * layerHeight + layerHeight * 0.5;
        
        const geo = new THREE.ConeGeometry(layerRadius, layerHeight, 6);
        const color = getMountainColor(mtnColor, layerRatio);
        const mat = new THREE.MeshStandardMaterial({
          color,
          roughness: 0.88 - layerRatio * 0.15,
          metalness: 0.02,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = layerY;
        mesh.rotation.y = seed * 0.77 + layer * 0.3;
        mesh.scale.x = 1.0 + deterministicNoise(seed + layer + 1) * 0.35;
        mesh.scale.z = 0.75 + deterministicNoise(seed + layer + 2) * 0.3;
        mesh.castShadow = false;
        mesh.receiveShadow = false;
        group.add(mesh);
      }
      
      // Snow cap (separate small cone on top)
      const capGeo = new THREE.ConeGeometry(radius * 0.28, height * 0.18, 6);
      const capMat = new THREE.MeshStandardMaterial({
        color: 0xf3efe2,
        roughness: 0.6,
        metalness: 0.02,
      });
      const cap = new THREE.Mesh(capGeo, capMat);
      cap.position.y = height * 0.91;
      cap.rotation.y = seed * 0.77;
      cap.scale.x = 1.0 + deterministicNoise(seed + 10) * 0.2;
      cap.scale.z = 0.8 + deterministicNoise(seed + 11) * 0.15;
      cap.castShadow = false;
      cap.receiveShadow = false;
      group.add(cap);

      return group;
    }

    function createMountainRidge3D(peakA, peakB, mtnColor, mapScale) {
      // Create a 3D ridge with volume (not just flat plane)
      const dx = peakB[0] - peakA[0];
      const dz = peakB[1] - peakA[1];
      const length = Math.sqrt(dx * dx + dz * dz) * mapScale;
      const midX = (peakA[0] + peakB[0]) / 2 * mapScale;
      const midZ = (peakA[1] + peakB[1]) / 2 * mapScale;
      const angle = Math.atan2(dz, dx);
      
      const ridgeGroup = new THREE.Group();
      
      // Ridge spine - elongated box with tapered ends
      const ridgeWidth = 1.8;
      const ridgeHeight = 1.2;
      const spineGeo = new THREE.BoxGeometry(length, ridgeHeight, ridgeWidth);
      const spineMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(mtnColor).multiplyScalar(0.88),
        roughness: 0.9,
        metalness: 0.02,
      });
      const spine = new THREE.Mesh(spineGeo, spineMat);
      spine.position.y = ridgeHeight * 0.5 + 0.1;
      spine.castShadow = false;
      spine.receiveShadow = false;
      ridgeGroup.add(spine);
      
      // Ridge cap (slightly lighter)
      const capGeo = new THREE.BoxGeometry(length * 0.94, ridgeHeight * 0.35, ridgeWidth * 0.88);
      const capMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(mtnColor).multiplyScalar(1.02),
        roughness: 0.85,
        metalness: 0.02,
      });
      const cap = new THREE.Mesh(capGeo, capMat);
      cap.position.y = ridgeHeight + 0.05;
      cap.castShadow = false;
      cap.receiveShadow = false;
      ridgeGroup.add(cap);
      
      // Foothill tapers at both ends
      for (const end of [-1, 1]) {
        const taperGeo = new THREE.ConeGeometry(ridgeWidth * 0.65, ridgeHeight * 1.2, 6);
        const taperMat = new THREE.MeshStandardMaterial({
          color: new THREE.Color(mtnColor).multiplyScalar(0.8),
          roughness: 0.9,
          metalness: 0.02,
        });
        const taper = new THREE.Mesh(taperGeo, taperMat);
        taper.position.set(
          end * length * 0.52,
          ridgeHeight * 0.6,
          0
        );
        taper.castShadow = false;
        taper.receiveShadow = false;
        ridgeGroup.add(taper);
      }
      
      ridgeGroup.position.set(midX, 0, midZ);
      ridgeGroup.rotation.y = -angle - Math.PI / 2;
      return ridgeGroup;
    }

    function createFoothillCluster(center, tangent, mtnColor, mapScale, count = 5) {
      const group = new THREE.Group();
      const normal = new THREE.Vector2(-tangent.y, tangent.x).normalize();
      
      for (let i = 0; i < count; i++) {
        const seed = center[0] * 1000 + center[1] * 100 + i * 7;
        const offsetAlong = (deterministicNoise(seed + 1) - 0.5) * 8.0;
        const offsetSide = (deterministicNoise(seed + 2) - 0.5) * 6.0;
        const radius = (1.8 + deterministicNoise(seed + 3) * 1.2);
        const height = (3.5 + deterministicNoise(seed + 4) * 2.5);
        
        // Foothills are lower, broader, less snow
        const peakGroup = new THREE.Group();
        const layers = 3;
        for (let layer = 0; layer < layers; layer++) {
          const layerRatio = layer / (layers - 1);
          const layerHeight = height / layers;
          const layerRadius = radius * (1 - layerRatio * 0.5);
          const layerY = layer * layerHeight + layerHeight * 0.5;
          
          const geo = new THREE.ConeGeometry(layerRadius, layerHeight, 5);
          const color = new THREE.Color(mtnColor).multiplyScalar(0.75 + layerRatio * 0.15);
          const mat = new THREE.MeshStandardMaterial({
            color,
            roughness: 0.9,
            metalness: 0.02,
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.y = layerY;
          mesh.rotation.y = seed * 0.5 + layer;
          mesh.scale.x = 1.0 + deterministicNoise(seed + layer + 10) * 0.4;
          mesh.scale.z = 0.8 + deterministicNoise(seed + layer + 11) * 0.3;
          mesh.castShadow = false;
          mesh.receiveShadow = false;
          peakGroup.add(mesh);
        }
        
        peakGroup.position.set(
          center[0] * mapScale + tangent.x * offsetAlong + normal.x * offsetSide,
          0.1,
          center[1] * mapScale + tangent.y * offsetAlong + normal.y * offsetSide
        );
        group.add(peakGroup);
      }
      
      return group;
    }

    function addMountainRange(mtn) {
      const rangeLength = mtn.peaks.reduce((sum, peak, idx) => {
        if (idx === 0) return sum;
        const prev = mtn.peaks[idx - 1];
        return sum + Math.sqrt((peak[0] - prev[0]) ** 2 + (peak[1] - prev[1]) ** 2);
      }, 0);
      const sizeBoost = rangeLength > 4 ? 1.15 : 0.95;

      mtn.peaks.forEach((peak, idx) => {
        const next = mtn.peaks[Math.min(idx + 1, mtn.peaks.length - 1)];
        const prev = mtn.peaks[Math.max(idx - 1, 0)];
        const tangent = new THREE.Vector2(next[0] - prev[0], next[1] - prev[1]);
        if (tangent.lengthSq() === 0) tangent.set(1, 0);
        tangent.normalize();
        
        // Main peak cluster
        const peakMesh = createMountainPeakMesh(
          (0.24 + deterministicNoise(idx * 100 + 1) * 0.12) * sizeBoost,
          (0.6 + deterministicNoise(idx * 100 + 2) * 0.44) * sizeBoost,
          mtn.color,
          idx * 100
        );
        peakMesh.position.set(peak[0] * MAP_SCALE, 0.16, peak[1] * MAP_SCALE);
        mountainGroup.add(peakMesh);
        
        // Ridge to next peak
        if (idx < mtn.peaks.length - 1) {
          const ridge = createMountainRidge3D(peak, mtn.peaks[idx + 1], mtn.color, MAP_SCALE);
          mountainGroup.add(ridge);
        }
        
        // Foothill clusters along the range
        if (idx < mtn.peaks.length - 1) {
          const segmentNext = mtn.peaks[idx + 1];
          const dx = segmentNext[0] - peak[0];
          const dz = segmentNext[1] - peak[1];
          const segmentLength = Math.sqrt(dx * dx + dz * dz);
          const steps = Math.max(2, Math.floor(segmentLength * 1.8));
          
          // Foothills on both sides of the ridge
          for (let s = 1; s <= steps; s++) {
            const t = s / (steps + 1);
            const point = [peak[0] + dx * t, peak[1] + dz * t];
            const segmentTangent = new THREE.Vector2(dx, dz).normalize();
            
            // Skip near main peaks
            const distToPeak = Math.min(
              Math.sqrt((point[0] - peak[0])**2 + (point[1] - peak[1])**2),
              Math.sqrt((point[0] - segmentNext[0])**2 + (point[1] - segmentNext[1])**2)
            );
            if (distToPeak < 0.8) continue;
            
            // Add foothill clusters on alternating sides
            if (s % 2 === 0) {
              const foothills = createFoothillCluster(point, segmentTangent, mtn.color, MAP_SCALE, 3);
              mountainGroup.add(foothills);
            }
          }
        }
      });
    }

    function createMountainAssets() {
      MOUNTAINS.forEach(mtn => {
        addMountainRange(mtn);

        const midPeak = mtn.peaks[Math.floor(mtn.peaks.length / 2)];
        const labelDiv = document.createElement('div');
        labelDiv.style.cssText = 'color:#8a7a6a;font-size:9px;font-weight:500;text-shadow:0 0 3px #000;pointer-events:none;white-space:nowrap;';
        labelDiv.textContent = mtn.name;
        const label = new CSS2DObject(labelDiv);
        label.position.set(midPeak[0] * MAP_SCALE, 2.0, midPeak[1] * MAP_SCALE);
        scene.add(label);
      });
    }

    createMountainAssets();

    // ============================================
    // STRATEGIC PASSES
    // ============================================
    const passGroup = new THREE.Group();
    scene.add(passGroup);

    function createPassTower(color, roofColor) {
      const tower = new THREE.Group();

      const baseGeo = new THREE.CylinderGeometry(0.18 * FEATURE_SCALE, 0.22 * FEATURE_SCALE, 0.16 * FEATURE_SCALE, 8);
      const baseMat = new THREE.MeshStandardMaterial({ color: 0x4f4338, roughness: 0.85 });
      const base = new THREE.Mesh(baseGeo, baseMat);
      base.position.y = 0.08 * FEATURE_SCALE;
      tower.add(base);

      const bodyGeo = new THREE.CylinderGeometry(0.14 * FEATURE_SCALE, 0.16 * FEATURE_SCALE, 0.42 * FEATURE_SCALE, 8);
      const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.82, metalness: 0.05 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.36 * FEATURE_SCALE;
      tower.add(body);

      const roofGeo = new THREE.ConeGeometry(0.26 * FEATURE_SCALE, 0.24 * FEATURE_SCALE, 4);
      const roofMat = new THREE.MeshStandardMaterial({ color: roofColor, roughness: 0.68, metalness: 0.15 });
      const roof = new THREE.Mesh(roofGeo, roofMat);
      roof.position.y = 0.68 * FEATURE_SCALE;
      roof.rotation.y = Math.PI / 4;
      tower.add(roof);

      return tower;
    }

    function createPassGate(pass) {
      const gate = new THREE.Group();
      const wallColor = 0x6f604f;
      const roofColor = 0xc89833;
      const spacing = 0.48 * FEATURE_SCALE;

      [-1, 1].forEach(side => {
        const tower = createPassTower(wallColor, roofColor);
        tower.position.x = side * spacing;
        gate.add(tower);
      });

      const lintelGeo = new THREE.CylinderGeometry(0.08 * FEATURE_SCALE, 0.08 * FEATURE_SCALE, spacing * 1.65, 8);
      const lintelMat = new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.85 });
      const lintel = new THREE.Mesh(lintelGeo, lintelMat);
      lintel.position.y = 0.46 * FEATURE_SCALE;
      lintel.rotation.z = Math.PI / 2;
      gate.add(lintel);

      const roofGeo = new THREE.ConeGeometry(0.34 * FEATURE_SCALE, 0.18 * FEATURE_SCALE, 4);
      const roofMat = new THREE.MeshStandardMaterial({ color: roofColor, roughness: 0.7, metalness: 0.15 });
      const roof = new THREE.Mesh(roofGeo, roofMat);
      roof.position.y = 0.6 * FEATURE_SCALE;
      roof.rotation.y = Math.PI / 4;
      gate.add(roof);

      gate.position.set(pass.pos[0] * MAP_SCALE, 0, pass.pos[1] * MAP_SCALE);
      gate.scale.setScalar(0.55);
      return gate;
    }

    STRATEGIC_PASSES.forEach(pass => {
      const passGeo = new THREE.RingGeometry(0.4 * FEATURE_SCALE, 0.6 * FEATURE_SCALE, 8);
      const passMat = new THREE.MeshBasicMaterial({ 
        color: 0xd4a843, 
        transparent: true, 
        opacity: 0.38, 
        side: THREE.DoubleSide,
        depthWrite: false,
        depthTest: true,
      });
      const passMesh = new THREE.Mesh(passGeo, passMat);
      passMesh.rotation.x = -Math.PI/2;
      passMesh.position.set(pass.pos[0] * MAP_SCALE, 0.3, pass.pos[1] * MAP_SCALE);
      passMesh.userData = { isPass: true, name: pass.name, desc: pass.desc };
      passGroup.add(passMesh);

      passGroup.add(createPassGate(pass));

      // Pass label
      const labelDiv = document.createElement('div');
      labelDiv.style.cssText = 'color:#d4a843;font-size:10px;font-weight:600;text-shadow:0 0 3px #000;pointer-events:none;white-space:nowrap;';
      labelDiv.textContent = pass.name;
      const label = new CSS2DObject(labelDiv);
      label.position.set(pass.pos[0] * MAP_SCALE, 1.8, pass.pos[1] * MAP_SCALE);
      scene.add(label);
    });

    // ============================================
    // CITADELS / CITIES (Thành trì) - Chinese Architecture Style
    // ============================================
    // Enhanced Chinese-style architecture: gates, walls, courtyards, palace tiers
    function createCitadel(cit) {
      const [x, z] = cit.pos;
      const isCapital = cit.type === 'capital';
      const group = new THREE.Group();
      group.position.set(x * MAP_SCALE, 0, z * MAP_SCALE);
      
      const wallColor = isCapital ? 0xd4a843 : 0xa89878;
      const roofColor = isCapital ? 0xc89833 : 0x8a7a5a;
      const wallHeight = isCapital ? 1.65 : 1.05;
      const wallThickness = 0.32;
      const wallRadius = isCapital ? 3.5 : 2.5;
      const courtyardRadius = wallRadius * 0.55;

      // --- Helper: Chinese upturned eave roof ---
      function createEaveRoof(radius, height, color, segments = 8) {
        const group = new THREE.Group();
        const roofGeo = new THREE.ConeGeometry(radius, height, segments);
        const roofMat = new THREE.MeshStandardMaterial({
          color, roughness: 0.6, metalness: 0.25
        });
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.castShadow = false;
        roof.receiveShadow = false;
        group.add(roof);
        
        // Upturned corners (dougong-inspired)
        for (let c = 0; c < segments; c++) {
          const angle = (c / segments) * Math.PI * 2;
          const cornerGeo = new THREE.BoxGeometry(0.18, 0.08, radius * 0.45);
          const cornerMat = new THREE.MeshStandardMaterial({ color, roughness: 0.6 });
          const corner = new THREE.Mesh(cornerGeo, cornerMat);
          corner.position.set(
            Math.cos(angle) * radius * 0.85,
            height * 0.15,
            Math.sin(angle) * radius * 0.85
          );
          corner.rotation.y = -angle;
          corner.castShadow = false;
          corner.receiveShadow = false;
          group.add(corner);
        }
        return group;
      }

      // --- Helper: Gate tower with Chinese architecture ---
      function createGateTower(isCapital) {
        const tower = new THREE.Group();
        const towerScale = isCapital ? 1.0 : 0.85;
        const baseColor = 0x5a4a3a;
        const bodyColor = 0x7a6a5a;
        
        // Stone podium
        const podiumGeo = new THREE.CylinderGeometry(1.1 * towerScale, 1.3 * towerScale, 0.8 * towerScale, 8);
        const podiumMat = new THREE.MeshStandardMaterial({ color: baseColor, roughness: 0.9 });
        const podium = new THREE.Mesh(podiumGeo, podiumMat);
        podium.position.y = 0.4 * towerScale;
        podium.castShadow = false;
        podium.receiveShadow = false;
        tower.add(podium);
        
        // Tower body (slightly tapered)
        const bodyGeo = new THREE.CylinderGeometry(0.85 * towerScale, 1.0 * towerScale, isCapital ? 3.0 : 2.4, 8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.8, metalness: 0.08 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = (isCapital ? 2.2 : 1.8) * towerScale;
        body.castShadow = false;
        body.receiveShadow = false;
        tower.add(body);
        
        // Observation deck / balcony
        const deckGeo = new THREE.CylinderGeometry(1.15 * towerScale, 1.15 * towerScale, 0.3 * towerScale, 8);
        const deckMat = new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.82, metalness: 0.08 });
        const deck = new THREE.Mesh(deckGeo, deckMat);
        deck.position.y = (isCapital ? 3.7 : 3.0) * towerScale;
        deck.castShadow = false;
        deck.receiveShadow = false;
        tower.add(deck);
        
        // Chinese eave roof
        const roofGroup = createEaveRoof(1.35 * towerScale, 1.2 * towerScale, roofColor);
        roofGroup.position.y = (isCapital ? 4.3 : 3.6) * towerScale;
        tower.add(roofGroup);
        
        // Chiwen ornaments on roof ridge
        const ornamentGeo = new THREE.ConeGeometry(0.15 * towerScale, 0.8 * towerScale, 4);
        const ornamentMat = new THREE.MeshStandardMaterial({ color: 0xf0d840, metalness: 0.5, roughness: 0.3 });
        const ornament = new THREE.Mesh(ornamentGeo, ornamentMat);
        ornament.position.y = (isCapital ? 4.9 : 4.2) * towerScale;
        ornament.castShadow = false;
        ornament.receiveShadow = false;
        tower.add(ornament);
        
        return tower;
      }

      // --- 1. Outer Wall with proper crenellations ---
      const wallSegments = isCapital ? 16 : 12;
      for (let i = 0; i < wallSegments; i++) {
        const angle = (i / wallSegments) * Math.PI * 2;
        const nextAngle = ((i + 1) / wallSegments) * Math.PI * 2;
        const x1 = Math.cos(angle) * wallRadius;
        const z1 = Math.sin(angle) * wallRadius;
        const x2 = Math.cos(nextAngle) * wallRadius;
        const z2 = Math.sin(nextAngle) * wallRadius;
        
        const wallLength = Math.sqrt((x2 - x1) ** 2 + (z2 - z1) ** 2);
        
        // Wall base
        const wallGeo = new THREE.BoxGeometry(wallLength, wallHeight, wallThickness);
        const wallMat = new THREE.MeshStandardMaterial({ 
          color: isCapital ? 0xb8945c : 0x9b8d72, roughness: 0.9, metalness: 0.04 
        });
        const wall = new THREE.Mesh(wallGeo, wallMat);
        wall.position.set((x1 + x2) / 2, wallHeight / 2, (z1 + z2) / 2);
        wall.rotation.y = Math.atan2(z1 - z2, x1 - x2);
        wall.castShadow = false;
        wall.receiveShadow = false;
        group.add(wall);
        
        // Crenellations (battlements) - merlons and embrasures
        const crenCount = Math.max(4, Math.floor(wallLength / 0.55));
        for (let c = 0; c < crenCount; c++) {
          const t = (c + 0.5) / crenCount;
          const cx = x1 + (x2 - x1) * t;
          const cz = z1 + (z2 - z1) * t;
          
          // Merlon (solid part)
          const merlonGeo = new THREE.BoxGeometry(0.28, 0.32, wallThickness + 0.1);
          const merlonMat = new THREE.MeshStandardMaterial({ color: 0x7a6a5a, roughness: 0.9 });
          const merlon = new THREE.Mesh(merlonGeo, merlonMat);
          merlon.position.set(cx, wallHeight + 0.16, cz);
          merlon.rotation.y = Math.atan2(z1 - z2, x1 - x2);
          merlon.castShadow = false;
          merlon.receiveShadow = false;
          group.add(merlon);
        }
        
        // Wall walkway (inner side)
        const walkGeo = new THREE.BoxGeometry(wallLength * 0.95, 0.12, wallThickness * 0.8);
        const walkMat = new THREE.MeshStandardMaterial({ color: 0x6a5a4a, roughness: 0.95 });
        const walk = new THREE.Mesh(walkGeo, walkMat);
        walk.position.set((x1 + x2) / 2, wallHeight - 0.3, (z1 + z2) / 2);
        walk.rotation.y = Math.atan2(z1 - z2, x1 - x2);
        walk.castShadow = false;
        walk.receiveShadow = false;
        group.add(walk);
      }

      // --- 2. Gates (4 cardinal directions) with gate towers ---
      const gatePositions = [
        { angle: 0, name: 'South' },
        { angle: Math.PI / 2, name: 'West' },
        { angle: Math.PI, name: 'North' },
        { angle: -Math.PI / 2, name: 'East' }
      ];
      
      gatePositions.forEach((gate, gi) => {
        const gx = Math.cos(gate.angle) * (wallRadius + 0.25);
        const gz = Math.sin(gate.angle) * (wallRadius + 0.25);
        
        // Gate opening in wall (remove section)
        // Create gate tower pair
        const gateGroup = new THREE.Group();
        
        // Two towers flanking the gate
        [-1, 1].forEach(side => {
          const tower = createGateTower(isCapital);
          const towerOffset = side * 2.2;
          tower.position.set(
            Math.cos(gate.angle) * (wallRadius + 0.15) - Math.sin(gate.angle) * 2.2 * side,
            0,
            Math.sin(gate.angle) * (wallRadius + 0.15) + Math.cos(gate.angle) * 2.2 * side
          );
          tower.rotation.y = gate.angle;
          gateGroup.add(tower);
        });
        
        // Gate lintel connecting towers
        const lintelGeo = new THREE.BoxGeometry(4.2, 0.35, 0.5);
        const lintelMat = new THREE.MeshStandardMaterial({ color: 0x6f604f, roughness: 0.85 });
        const lintel = new THREE.Mesh(lintelGeo, lintelMat);
        lintel.position.y = isCapital ? 2.0 : 1.6;
        lintel.castShadow = false;
        lintel.receiveShadow = false;
        gateGroup.add(lintel);
        
        // Gate roof over passage
        const gateRoofGroup = createEaveRoof(1.8, 0.7, roofColor, 6);
        gateRoofGroup.position.y = isCapital ? 2.4 : 2.0;
        gateGroup.add(gateRoofGroup);
        
        gateGroup.position.set(
          Math.cos(gate.angle) * (wallRadius + 0.15),
          0,
          Math.sin(gate.angle) * (wallRadius + 0.15)
        );
        gateGroup.rotation.y = gate.angle;
        group.add(gateGroup);
      });

      // --- 3. Inner Courtyard Buildings ---
      // Main Palace (central)
      const palaceHeight = isCapital ? 14.0 : 9.0;
      const palaceBaseRadius = isCapital ? 3.2 : 2.2;
      
      // Palace platform
      const platformGeo = new THREE.CylinderGeometry(palaceBaseRadius * 1.1, palaceBaseRadius * 1.1, 0.9, 12);
      const platformMat = new THREE.MeshStandardMaterial({ color: 0x5a4a3a, roughness: 0.9 });
      const platform = new THREE.Mesh(platformGeo, platformMat);
      platform.position.y = 0.45;
      platform.castShadow = false;
      platform.receiveShadow = false;
      group.add(platform);
      
      // Multi-tier palace with upturned eaves
      const tierCount = isCapital ? 5 : 3;
      for (let t = 0; t < tierCount; t++) {
        const tierRatio = t / (tierCount - 1);
        const tierRadius = palaceBaseRadius * (1.0 - tierRatio * 0.28);
        const tierHeight = palaceHeight / tierCount * 0.7;
        const tierY = 0.9 + t * (palaceHeight / tierCount);
        
        // Building body
        const bodyGeo = new THREE.CylinderGeometry(
          tierRadius, tierRadius * 1.08, tierHeight, 10
        );
        const bodyMat = new THREE.MeshStandardMaterial({ 
          color: isCapital ? 0xd4c8a8 : 0xc8b898, 
          roughness: 0.8, metalness: 0.1 
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = tierY + tierHeight / 2;
        body.castShadow = false;
        body.receiveShadow = false;
        group.add(body);
        
        // Upturned eave roof (Chinese style)
        const roofGroup = createEaveRoof(tierRadius * 1.35, tierHeight * 0.55, roofColor);
        roofGroup.position.y = tierY + tierHeight + tierHeight * 0.2;
        group.add(roofGroup);
        
        // Ridge ornaments on top tier
        if (t === tierCount - 1) {
          const ornamentGeo = new THREE.ConeGeometry(0.22, 1.1, 4);
          const ornamentMat = new THREE.MeshStandardMaterial({ color: 0xf0d840, metalness: 0.5, roughness: 0.3 });
          const ornament = new THREE.Mesh(ornamentGeo, ornamentMat);
          ornament.position.y = tierY + tierHeight + tierHeight * 0.55;
          ornament.castShadow = false;
          ornament.receiveShadow = false;
          group.add(ornament);
        }
      }
      
      // --- 4. Four Corner Towers (larger, more detailed) ---
      for (let i = 0; i < 4; i++) {
        const angle = (i / 4) * Math.PI * 2 + Math.PI / 4;
        const tx = Math.cos(angle) * (wallRadius + 1.1);
        const tz = Math.sin(angle) * (wallRadius + 1.1);
        
        const towerGroup = new THREE.Group();
        towerGroup.position.set(tx, 0, tz);
        
        // Tower base (stone)
        const baseGeo = new THREE.CylinderGeometry(1.1, 1.35, 1.2, 8);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x5a4a3a, roughness: 0.9 });
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.y = 0.6;
        base.castShadow = false;
        base.receiveShadow = false;
        towerGroup.add(base);
        
        // Tower body
        const bodyGeo = new THREE.CylinderGeometry(0.95, 1.1, isCapital ? 3.0 : 2.2, 8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x7a6a5a, roughness: 0.8, metalness: 0.08 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = isCapital ? 2.6 : 1.9;
        body.castShadow = false;
        body.receiveShadow = false;
        towerGroup.add(body);
        
        // Tower roof with upturned eaves
        const roofGroup = createEaveRoof(1.55, 1.5, roofColor, 6);
        roofGroup.position.y = isCapital ? 4.2 : 3.2;
        towerGroup.add(roofGroup);
        
        // Corner ornament
        const ornamentGeo = new THREE.ConeGeometry(0.12, 0.7, 4);
        const ornamentMat = new THREE.MeshStandardMaterial({ color: 0xf0d840, metalness: 0.5, roughness: 0.3 });
        const ornament = new THREE.Mesh(ornamentGeo, ornamentMat);
        ornament.position.y = isCapital ? 5.0 : 4.0;
        ornament.castShadow = false;
        ornament.receiveShadow = false;
        towerGroup.add(ornament);
        
        group.add(towerGroup);
      }
      
      // --- 5. Side Courtyard Buildings (barracks, storehouses, offices) ---
      const buildingCount = isCapital ? 6 : 3;
      for (let i = 0; i < buildingCount; i++) {
        const angle = (i / buildingCount) * Math.PI * 2;
        const bx = Math.cos(angle) * courtyardRadius;
        const bz = Math.sin(angle) * courtyardRadius;
        
        const bldGroup = new THREE.Group();
        bldGroup.position.set(bx, 0, bz);
        bldGroup.rotation.y = angle + Math.PI / 2;
        
        // Rectangular building with Chinese roof
        const bldWidth = isCapital ? 2.2 : 1.6;
        const bldDepth = isCapital ? 1.3 : 1.0;
        const bldHeight = isCapital ? 2.0 : 1.5;
        
        const bodyGeo = new THREE.BoxGeometry(bldWidth, bldHeight, bldDepth);
        const bodyMat = new THREE.MeshStandardMaterial({ 
          color: isCapital ? 0xd4c8a8 : 0xc8b898, 
          roughness: 0.85, metalness: 0.08 
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = bldHeight / 2;
        body.castShadow = false;
        body.receiveShadow = false;
        bldGroup.add(body);
        
        // Gabled roof with upturned ends
        const roofGeo = new THREE.BoxGeometry(bldWidth * 1.25, bldHeight * 0.45, bldDepth * 1.35);
        const roofMat = new THREE.MeshStandardMaterial({ color: roofColor, roughness: 0.6, metalness: 0.2 });
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.y = bldHeight + bldHeight * 0.22;
        roof.castShadow = false;
        roof.receiveShadow = false;
        bldGroup.add(roof);
        
        // Roof ridge ornaments
        const ridgeGeo = new THREE.BoxGeometry(bldWidth * 0.1, 0.2, bldDepth * 0.9);
        const ridgeMat = new THREE.MeshStandardMaterial({ color: 0xf0d840, metalness: 0.5, roughness: 0.3 });
        const ridge = new THREE.Mesh(ridgeGeo, ridgeMat);
        ridge.position.y = bldHeight + bldHeight * 0.45;
        ridge.castShadow = false;
        ridge.receiveShadow = false;
        bldGroup.add(ridge);
        
        group.add(bldGroup);
      }
      
      // --- 6. Flag on main palace ---
      if (cit.owner) {
        const faction = FACTIONS.find(f => f.id === cit.owner);
        const flagGeo = new THREE.PlaneGeometry(1.5, 1.0);
        const flagMat = new THREE.MeshBasicMaterial({ 
          color: faction ? faction.color : 0x888888, 
          transparent: true, opacity: 1.0, side: THREE.DoubleSide 
        });
        const flag = new THREE.Mesh(flagGeo, flagMat);
        flag.position.set(0, palaceHeight + 2.0, 0);
        flag.userData = { isFlag: true, baseColor: new THREE.Color(faction ? faction.color : 0x888888) };
        group.add(flag);
      }
      
      group.scale.setScalar(isCapital ? 0.86 : 0.78);
      return group;
    }

    function createCitadelAssetGroup(cit) {
      // V1 keeps the local tower/gate/palace layout because no matching CC0 Chinese citadel GLB is bundled yet.
      return createCitadel(cit);
    }    // Build all citadels
    const citadelMeshes = {};
    CITADELS.forEach(cit => {
      const citadelGroup = createCitadelAssetGroup(cit);

      labelDiv.textContent = cit.name;
      const label = new CSS2DObject(labelDiv);
      label.position.set(cit.pos[0] * MAP_SCALE, isCapital ? 18.0 : 12.0, cit.pos[1] * MAP_SCALE);
      scene.add(label);
    });

    // ============================================
    // ASSET VEGETATION (Trees/Bushes)
    // ============================================
    const vegetationGroup = new THREE.Group();
    scene.add(vegetationGroup);

    // Tree types with reduced scales (smaller than citadels) and biome clustering
    const treeTypes = [
      { name: 'pine', assetIds: ['treePine', 'treePineDark'], color: 0x2d5a2d, biome: ['mountains', 'steppes'], count: 120, scale: 0.10 },
      { name: 'oak', assetIds: ['treeBroadleaf', 'treeBlock'], color: 0x3a7a3a, biome: ['plains', 'riverlands'], count: 100, scale: 0.09 },
      { name: 'tropical', assetIds: ['treeFat', 'treeBlock'], color: 0x2a6a2a, biome: ['tropical', 'coastal'], count: 70, scale: 0.11 },
      { name: 'bamboo', assetIds: ['bamboo'], color: 0x4a8a3a, biome: ['tropical', 'riverlands'], count: 50, scale: 0.08 },
      { name: 'brush', assetIds: ['brush', 'grassLarge'], color: 0x3d7a42, biome: ['plains', 'riverlands', 'coastal', 'tropical'], count: 80, scale: 0.07 },
    ];

    // Biome color bands for forest clustering (used for visual coherence)
    const biomeColors = {
      mountains: 0x2d5a2d,
      steppes: 0x3a5a3a,
      plains: 0x3a7a3a,
      riverlands: 0x2a6a2a,
      tropical: 0x2a6a2a,
      coastal: 0x3d7a42,
      capital: 0x3a6a3a,
      basin: 0x3a7a3a,
    };

    function createFallbackTree(type) {
      const group = new THREE.Group();

      if (type.name === 'bamboo') {
        for (let i = 0; i < 5; i++) {
          const stalk = new THREE.Mesh(
            new THREE.CylinderGeometry(0.03, 0.05, 4.0, 4),
            new THREE.MeshStandardMaterial({ color: 0x4a8a3a, roughness: 0.75 })
          );
          stalk.position.set((Math.random() - 0.5) * 0.3, 2.0, (Math.random() - 0.5) * 0.3);
          group.add(stalk);

        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.18, 0.34, 1.1, 6),
          new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 0.9 })
        );
        trunk.position.y = 0.55;
        group.add(trunk);

        const foliage = new THREE.Mesh(
          new THREE.SphereGeometry(type.name === 'tropical' ? 1.55 : 1.05, 8, 6),

        );
        foliage.position.y = type.name === 'tropical' ? 2.25 : 1.6;

        );
        trunk.position.y = 0.45;
        group.add(trunk);
        for (let i = 0; i < 3; i++) {
          const foliage = new THREE.Mesh(

          );

        }
      }

      group.traverse(child => {
        if (!child.isMesh) return;
        child.castShadow = false;
        child.receiveShadow = false;
      });
      return group;
    }

    function getTerrainHeightAt(x, z) {
      const mx = x / MAP_SCALE;
      const mz = z / MAP_SCALE;

      let minDist = Infinity;
      let baseTerrain = 'plains';
      for (const prov of PROVINCES) {
        const d = Math.sqrt((mx - prov.pos[0]) ** 2 + (mz - prov.pos[1]) ** 2);
        if (d < minDist) { minDist = d; baseTerrain = prov.terrain || 'plains'; }
      }

      let elevation = 0;
      switch(baseTerrain) {
        case 'plains': elevation = 0.05; break;
        case 'capital': elevation = 0.1; break;
        case 'riverlands': elevation = 0.0; break;
        case 'coastal': elevation = 0.03; break;
        case 'tropical': elevation = 0.08; break;
        case 'mountains': elevation = 0.5; break;
        case 'steppes': elevation = 0.12; break;
        case 'basin': elevation = 0.08; break;
        case 'desert': elevation = 0.2; break;
        default: elevation = 0.05;
      }

      const noise = (Math.sin(mx * 1.2) * Math.cos(mz * 1.2) + Math.sin(mx * 4) * Math.cos(mz * 4) * 0.3) * 0.025;
      return elevation * TERRAIN_HEIGHT_MULT + noise;
    }

    function findVegetationPosition(type) {
      for (let attempts = 0; attempts < 24; attempts++) {
        const x = (Math.random() - 0.5) * groundSize * 0.82;
        const z = (Math.random() - 0.5) * groundSize * 0.82;
        const mx = x / MAP_SCALE;
        const mz = z / MAP_SCALE;

        let matchesBiome = false;
        for (const prov of PROVINCES) {
          const d = Math.sqrt((mx - prov.pos[0]) ** 2 + (mz - prov.pos[1]) ** 2);
          if (d < 2.35 && type.biome.includes(prov.terrain)) {
            matchesBiome = true;
            break;
          }
        }
        if (!matchesBiome) continue;

        return { x, z, y: getTerrainHeightAt(x, z) };
      }
      return null;
    }

    function createVegetationAsset(type, index) {
      const assetId = type.assetIds[index % type.assetIds.length];
      const model = assetManager.createModelInstance(assetId, {
        scale: type.scale * (0.82 + Math.random() * 0.36),
        rotationY: Math.random() * Math.PI * 2,
        tint: type.color,
      });
      return model || createFallbackTree(type);
    }

    function createForestAssets() {
      // Group provinces by biome for clustered forest bands
      const biomeProvinces = {};
      PROVINCES.forEach(prov => {
        const biome = prov.terrain;
        if (!biomeProvinces[biome]) biomeProvinces[biome] = [];
        biomeProvinces[biome].push(prov);
      });

      treeTypes.forEach(type => {
        // For each biome this tree type grows in, create clustered forests
        type.biome.forEach(biome => {
          const provinces = biomeProvinces[biome] || [];
          if (provinces.length === 0) return;
          
          // Distribute tree count across provinces of this biome
          const treesPerProvince = Math.max(1, Math.floor(type.count / provinces.length));
          
          provinces.forEach(prov => {
            // Create a forest cluster around each province center
            const clusterCenter = [prov.pos[0] * MAP_SCALE, prov.pos[1] * MAP_SCALE];
            const clusterRadius = 2.5 * MAP_SCALE; // Forest band radius
            const clusterCount = treesPerProvince;
            
            for (let i = 0; i < clusterCount; i++) {
              // Position within cluster with natural variation
              const angle = Math.random() * Math.PI * 2;
              const distance = Math.random() * clusterRadius * 0.85;
              const x = clusterCenter[0] + Math.cos(angle) * distance;
              const z = clusterCenter[1] + Math.sin(angle) * distance;
              const y = getTerrainHeightAt(x, z);
              
              // Skip if too close to citadel or road
              let tooClose = false;
              CITADELS.forEach(cit => {
                const dx = x - cit.pos[0] * MAP_SCALE;
                const dz = z - cit.pos[1] * MAP_SCALE;
                if (dx * dx + dz * dz < (5 * MAP_SCALE) ** 2) tooClose = true;
              });
              if (tooClose) return;
              
              const tree = createVegetationAsset(type, i);
              tree.position.set(x, y + 0.1, z);
              tree.rotation.y = Math.random() * Math.PI * 2;
              
              // Add slight scale variation for natural look
              const scaleVar = 0.85 + Math.random() * 0.3;
              tree.scale.multiplyScalar(scaleVar);
              
              vegetationGroup.add(tree);
            }
          });
        });
      });
    }

    createForestAssets();
    // ============================================
    const terrainColors = {
      capital: 0x7fab4e, plains: 0x83b94d, riverlands: 0x5fa987, basin: 0x91b95d,
      coastal: 0x74a98e, tropical: 0x3f9854, steppes: 0xc0a76d, mountains: 0x8d7b6b,
    };

    const provinceMeshes = {};
    const provinceOutlines = {};
    const provinceLabels = {};
    const provinceRadius = 0.48 * FEATURE_SCALE;

    PROVINCES.forEach(prov => {
      const [x, z] = prov.pos;
      const hexGeo = new THREE.CircleGeometry(provinceRadius, 6);
      const hexMat = new THREE.MeshBasicMaterial({ 
        color: terrainColors[prov.terrain] || terrainColors.plains, 
        transparent: true, 
        opacity: 0.045,
        depthWrite: false,
        depthTest: true,
        side: THREE.DoubleSide,
      });
      const hex = new THREE.Mesh(hexGeo, hexMat);
      hex.rotation.x = -Math.PI/2;
      hex.position.set(x * MAP_SCALE, 0.11, z * MAP_SCALE);
      hex.renderOrder = 1;
      hex.userData = { provinceId: prov.id, isProvince: true };
      scene.add(hex);
      provinceMeshes[prov.id] = hex;

      // Outline for ownership
      const outlineGeo = new THREE.RingGeometry(provinceRadius * 1.04, provinceRadius * 1.105, 6);
      const outlineMat = new THREE.MeshBasicMaterial({
        color: 0xd4a843,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0,
        depthWrite: false,
        depthTest: false,
      });
      const outline = new THREE.Mesh(outlineGeo, outlineMat);
      outline.rotation.x = -Math.PI/2;
      outline.position.set(x * MAP_SCALE, 0.19, z * MAP_SCALE);
      outline.renderOrder = 3;
      scene.add(outline);
      provinceOutlines[prov.id] = outline;

      // Label - more subtle
      const labelDiv = document.createElement('div');
      labelDiv.style.cssText = 'color:#5f583d;font-size:9px;font-weight:600;text-shadow:0 1px 2px rgba(255,255,255,0.85),0 0 3px rgba(0,0,0,0.25);pointer-events:none;white-space:nowrap;';
      labelDiv.textContent = prov.name;
      const label = new CSS2DObject(labelDiv);
      label.position.set(x * MAP_SCALE, 0.6, z * MAP_SCALE);
      scene.add(label);
      provinceLabels[prov.id] = label;
    });

    // Connection lines - more subtle
    const lineGroup = new THREE.Group();
    scene.add(lineGroup);
    const lineMat = new THREE.LineBasicMaterial({ color: 0x5a6a5a, transparent: true, opacity: 0.0 });
    PROVINCES.forEach(prov => {
      const [x1, z1] = prov.pos;
      prov.neighbors.forEach(nid => {
        const neighbor = PROVINCES.find(p => p.id === nid);
        if (!neighbor) return;
        const [x2, z2] = neighbor.pos;
        if (x1 < x2 || (x1 === x2 && z1 < z2)) {
          const geo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(x1*MAP_SCALE, 0.25, z1*MAP_SCALE), 
            new THREE.Vector3(x2*MAP_SCALE, 0.25, z2*MAP_SCALE)
          ]);
          lineGroup.add(new THREE.Line(geo, lineMat.clone()));
        }
      });
    });

    // Coastline
    const coastGeo = new THREE.BufferGeometry();
    const coastPoints = COASTLINE.map((v, i) => i % 2 === 0 ? new THREE.Vector3(v * MAP_SCALE, 0.15, COASTLINE[i+1] * MAP_SCALE) : null).filter(Boolean);
    coastGeo.setFromPoints(coastPoints);
    const coastMat = new THREE.LineBasicMaterial({ color: 0x3a6a8a, transparent: true, opacity: 0.06 });
    const coastLine = new THREE.Line(coastGeo, coastMat);
    scene.add(coastLine);

    // ============================================
    // FACTION ENTITIES (Armies)
    // ============================================
    const factionEntities = {};
    const armyGroups = {};

    FACTIONS.forEach((f) => {
      const starts = Array.isArray(f.start) ? f.start : [f.start];
      const group = new THREE.Group();
      scene.add(group);
      armyGroups[f.id] = group;
      factionEntities[f.id] = { ...f, troops: f.troops, grain: f.grain, loyalty: f.loyalty, prestige: f.prestige, provinces: [...starts], knownFactions: new Set([f.id]), alive: true, color: new THREE.Color(f.color), action: 'IDLE', quote: '—', targetProvince: null };
      const factionLabels = {};
      
      starts.forEach((provId) => {
        const prov = PROVINCES.find(p => p.id === provId);
        if (!prov) return;
        const [x, z] = prov.pos;
        // Larger, more prominent armies for game-like visibility
        const army = createArmyUnit(f.color, Math.min(20, f.troops / 8000 + 4));
        army.position.set(x * MAP_SCALE + (Math.random()-0.5)*4, 0, z * MAP_SCALE + (Math.random()-0.5)*4);
        army.userData = { factionId: f.id, provinceId: provId, armyId: `${f.id}_${provId}` };
        group.add(army);
        
        const labelDiv = document.createElement('div');
        labelDiv.style.cssText = `color:#${f.color.toString(16).padStart(6,'0')};font-size:13px;font-weight:700;text-shadow:0 0 6px #000, 0 0 3px #000;pointer-events:none;white-space:nowrap;`;
        labelDiv.textContent = f.name;
        const label = new CSS2DObject(labelDiv);
        label.position.set(x * MAP_SCALE, 4.0, z * MAP_SCALE);
        group.add(label);
        if (!factionLabels[f.id]) factionLabels[f.id] = [];
        factionLabels[f.id].push(label);
      });
      starts.forEach(provId => updateProvinceOwner(provId, f.id));
    });

    function createArmyUnit(color, size) {
      const group = new THREE.Group();
      const base = new THREE.Mesh(
        new THREE.CylinderGeometry(1.3, 1.5, 0.12, 16),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.18, depthWrite: false })
      );
      base.position.y = 0.06;
      group.add(base);
      // Taller pole with flag
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 4.0, 4), new THREE.MeshStandardMaterial({ color: 0x3d3328 }));
      pole.position.y = 2.2;
      group.add(pole);
      // Larger, more visible flag with emissive glow
      const flag = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 1.8), new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 1.0, side: THREE.DoubleSide }));
      flag.position.set(1.5, 3.5, 0);
      flag.userData = { isFlag: true, baseColor: new THREE.Color(color) };
      group.add(flag);
      // More soldiers, larger, spread out more
      for (let i = 0; i < Math.min(size, 16); i++) {
        const soldierGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
        const soldierMat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.5 });
        const soldier = new THREE.Mesh(soldierGeo, soldierMat);
        const angle = (i / Math.max(size, 1)) * Math.PI * 2;
        const radius = 2.5 + Math.random() * 1.5;
        soldier.position.set(Math.cos(angle) * radius, 0.5 + i * 0.25, Math.sin(angle) * radius);
        group.add(soldier);
      }
      group.userData.flag = flag;
      return group;
    }

    function updateProvinceOwner(provId, factionId) {
      const outline = provinceOutlines[provId];
      if (outline) { const fac = FACTIONS.find(f => f.id === factionId); if (fac) { outline.material.color.setHex(fac.color); outline.material.opacity = 0.72; } }
    }
    function clearProvinceOwner(provId) { const outline = provinceOutlines[provId]; if (outline) outline.material.opacity = 0; }

    // ============================================
    // DIPLOMACY LINES
    // ============================================
    const diplomacyGroup = new THREE.Group();
    scene.add(diplomacyGroup);
    const diplomacyLines = {};

    function updateDiplomacyLines() {
      // Clear old
      Object.values(diplomacyLines).forEach(line => { if (line.parent) line.parent.remove(line); });
      diplomacyLines.clear ? diplomacyLines.clear() : Object.keys(diplomacyLines).forEach(k => delete diplomacyLines[k]);
      
      // This will be populated from simulation data
    }

    // ============================================
    // PARTICLES / EFFECTS
    // ============================================
    const particleSystems = [];

    function spawnBattleParticles(position, color1, color2) {
      const count = 120;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const velocities = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const sizes = new Float32Array(count);
      const life = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        positions[i*3] = position.x + (Math.random()-0.5)*4;
        positions[i*3+1] = position.y + Math.random()*3;
        positions[i*3+2] = position.z + (Math.random()-0.5)*4;
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 5;
        velocities[i*3] = Math.cos(angle) * speed;
        velocities[i*3+1] = Math.random()*3 + 2;
        velocities[i*3+2] = Math.sin(angle) * speed;
        const c = new THREE.Color().lerpColors(new THREE.Color(color1), new THREE.Color(color2), Math.random());
        colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
        sizes[i] = 0.15 + Math.random() * 0.25;
        life[i] = 1.0;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('velocity', new THREE.BufferAttribute(velocities, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
      geo.setAttribute('life', new THREE.BufferAttribute(life, 1));
      const mat = new THREE.PointsMaterial({ size: 0.3, vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending });
      const system = new THREE.Points(geo, mat);
      system.userData = { age: 0, maxAge: 2.5 };
      scene.add(system);
      particleSystems.push(system);
    }

    function spawnMovementTrail(from, to, color) {
      const count = 30;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const alphas = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        const t = i / (count - 1);
        positions[i*3] = THREE.MathUtils.lerp(from.x, to.x, t) + (Math.random()-0.5)*0.5;
        positions[i*3+1] = 0.5 + Math.sin(t * Math.PI) * 1.0;
        positions[i*3+2] = THREE.MathUtils.lerp(from.z, to.z, t) + (Math.random()-0.5)*0.5;
        alphas[i] = 1 - t;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('alpha', new THREE.BufferAttribute(alphas, 1));
      const mat = new THREE.PointsMaterial({ size: 0.2, color, transparent: true, opacity: 0.7, depthWrite: false, blending: THREE.AdditiveBlending });
      const system = new THREE.Points(geo, mat);
      system.userData = { age: 0, maxAge: 1.5, type: 'trail' };
      scene.add(system);
      particleSystems.push(system);
    }

    // ============================================
    // SIMULATION STATE
    // ============================================
    let simTime = 0, simSpeed = 1.0, paused = false, selectedFaction = null, tick = 0;
    const TICK_DURATION = 3000;
    const events = [];
    const MAX_EVENTS = 100;
    let ws = null;

    function connectWS() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
      ws.onopen = () => console.log('WS connected');
      ws.onmessage = (e) => handleServerMessage(JSON.parse(e.data));
      ws.onclose = () => setTimeout(connectWS, 3000);
      ws.onerror = (e) => console.error('WS error', e);
    }

    function handleServerMessage(msg) {
      switch (msg.type) {
        case 'STATE': applyServerState(msg.data); break;
        case 'EVENTS': msg.events.forEach(e => { addEvent(e); if (e.type === 'BATTLE') showBattleEffect(e); else if (e.type === 'MOVEMENT') animateArmyMovement(e); }); break;
        case 'JOINED': console.log('Joined:', msg.sessionId); break;
      }
    }

    function applyServerState(data) {
      tick = data.tick; simTime = data.tick; updateTimeDisplay();
      Object.entries(data.factions).forEach(([id, f]) => {
        const e = factionEntities[id];
        if (!e) return;
        e.troops = f.troops; e.grain = f.grain; e.loyalty = f.loyalty; e.prestige = f.prestige;
        e.provinces = f.provinces || []; e.alive = f.alive; e.action = f.action || 'IDLE'; e.quote = f.quote || '—'; e.targetProvince = f.targetProvince || null;
      });
      renderFactionList(); updateProvinceVisuals();
    }

    function updateProvinceVisuals() {
      Object.keys(provinceOutlines).forEach(clearProvinceOwner);
      Object.values(factionEntities).forEach(e => { if (e.alive) e.provinces.forEach(pid => updateProvinceOwner(pid, e.id)); });
    }

    function showBattleEffect(data) {
      const prov = PROVINCES.find(p => p.id === data.province);
      if (!prov) return;
      const pos = new THREE.Vector3(prov.pos[0]*MAP_SCALE, 2, prov.pos[1]*MAP_SCALE);
      const attacker = FACTIONS.find(f => f.id === data.attacker);
      const defender = FACTIONS.find(f => f.id === data.defender);
      spawnBattleParticles(pos, attacker ? attacker.color : 0xef4444, defender ? defender.color : 0xef4444);
      const outline = provinceOutlines[data.province];
      if (outline) { outline.material.opacity = 0.72; outline.material.color.set(0xef4444); setTimeout(() => { const owner = PROVINCES.find(p => p.id === data.province)?.owner; if (owner) updateProvinceOwner(data.province, owner); else clearProvinceOwner(data.province); }, 500); }
    }

    function animateArmyMovement(data) {
      const fromProv = PROVINCES.find(p => p.id === data.from);
      const toProv = PROVINCES.find(p => p.id === data.to);
      if (!fromProv || !toProv) return;
      const fromPos = new THREE.Vector3(fromProv.pos[0]*MAP_SCALE, 0, fromProv.pos[1]*MAP_SCALE);
      const toPos = new THREE.Vector3(toProv.pos[0]*MAP_SCALE, 0, toProv.pos[1]*MAP_SCALE);
      const faction = FACTIONS.find(f => f.id === data.faction);
      spawnMovementTrail(fromPos, toPos, faction?.color || 0xd4a843);
      const animId = `${data.faction}_${data.from}_${data.to}_${Date.now()}`;
      armyAnimations.set(animId, { factionId: data.faction, from: data.from, to: data.to, progress: 0 });
    }

    function addEvent(event) {
      events.unshift({...event, time: Date.now()});
      if (events.length > MAX_EVENTS) events.pop();
      renderEventLog();
    }

    // ============================================
    // UI RENDERING
    // ============================================
    function updateTimeDisplay() {
      const year = 200 + Math.floor(tick / 52);
      const season = SEASONS[Math.floor((tick % 52) / 13)];
      document.getElementById('yearDisplay').textContent = year;
      document.getElementById('seasonDisplay').textContent = season;
      document.getElementById('tickDisplay').textContent = tick;
      document.getElementById('speedDisplay').textContent = simSpeed.toFixed(1) + 'x';
    }

    function renderEventLog() {
      document.getElementById('eventLog').innerHTML = events.map(e => {
        const t = new Date(e.time);
        const timeStr = `${t.getHours().toString().padStart(2,'0')}:${t.getMinutes().toString().padStart(2,'0')}:${t.getSeconds().toString().padStart(2,'0')}`;
        const typeClass = e.type === 'BATTLE' ? 'combat' : e.type === 'DIPLOMACY' ? 'diplomacy' : e.type === 'SUBTERFUGE' ? 'subterfuge' : 'internal';
        const fname = (id) => FACTIONS.find(f => f.id === id)?.name || id;
        const pname = (id) => PROVINCES.find(p => p.id === id)?.name || id;
        let text = '';
        switch(e.type) {
          case 'BATTLE': text = `⚔ ${fname(e.attacker)} tấn công ${fname(e.defender)} tại ${pname(e.province)} — ${e.outcome}`; break;
          case 'DIPLOMACY': text = `🕊 ${fname(e.faction)} ${e.subtype} ${fname(e.target)}`; break;
          case 'SUBTERFUGE': text = `🎭 ${fname(e.faction)} ${e.subtype} ${fname(e.target)}`; break;
          case 'INTERNAL': text = `🏛 ${fname(e.faction)} ${e.subtype}`; break;
          case 'ELIMINATED': text = `☠ ${fname(e.faction)} đã diệt vong!`; break;
          case 'VICTORY': text = `🏆 ${fname(e.faction)} thống nhất thiên hạ!`; break;
          default: text = JSON.stringify(e);
        }
        return `<div class="eventEntry"><span class="eventTime">[${timeStr}]</span><span class="eventText ${typeClass}">${text}</span></div>`;
      }).join('');
    }

    function renderFactionList() {
      const container = document.getElementById('factionList');
      const maxTroops = Math.max(...Object.values(factionEntities).map(e => e.troops), 1);
      const maxGrain = Math.max(...Object.values(factionEntities).map(e => e.grain), 1);
      const maxPrestige = Math.max(...Object.values(factionEntities).map(e => e.prestige), 1);
      container.innerHTML = FACTIONS.map(f => {
        const e = factionEntities[f.id];
        if (!e) return '';
        const isSelected = selectedFaction === f.id;
        const isAlive = e.alive;
        return `<div class="factionRow ${isAlive ? '' : 'eliminated'} ${isSelected ? 'selected' : ''}" data-faction="${f.id}" style="opacity:${isAlive ? 1 : 0.4}"><div class="factionColor" style="background:#${f.color.toString(16).padStart(6,'0')}"></div><div class="factionName">${f.name} ${isAlive ? '' : '(Diệt)'}</div></div>`;
      }).join('');
      container.querySelectorAll('.factionRow').forEach(row => row.addEventListener('click', () => selectFaction(row.dataset.faction)));
    }

    function selectFaction(id) {
      selectedFaction = id;
      const e = factionEntities[id]; const f = FACTIONS.find(f => f.id === id);
      document.getElementById('entityInfo').classList.add('visible');
      document.getElementById('selectedName').textContent = f?.name || id;
      document.getElementById('selectedType').textContent = f?.type === 'time_displaced' ? '🌀 Hoàng đế xuyên không' : '⚔ Quân phiệt lịch sử';
      const maxTroops = Math.max(...Object.values(factionEntities).map(x => x.troops), 1);
      const maxGrain = Math.max(...Object.values(factionEntities).map(x => x.grain), 1);
      const maxPrestige = Math.max(...Object.values(factionEntities).map(x => x.prestige), 1);
      document.getElementById('barTroops').style.width = `${(e.troops/maxTroops)*100}%`;
      document.getElementById('barGrain').style.width = `${(e.grain/maxGrain)*100}%`;
      document.getElementById('barLoyalty').style.width = `${e.loyalty}%`;
      document.getElementById('barPrestige').style.width = `${(e.prestige/maxPrestige)*100}%`;
      document.getElementById('selectedQuote').textContent = `"${e.quote}"`;
      document.getElementById('selectedAction').textContent = `Hành động: ${e.action} ${e.targetProvince ? `→ ${PROVINCES.find(p=>p.id===e.targetProvince)?.name}` : ''}`;
      renderFactionList();
    }

    function renderLegend() {
      document.getElementById('legend').innerHTML = [
        {color:0x3b82f6, label:'Lý Thế Dân (Đường)'}, {color:0xfbbf24, label:'Tần Thủy Hoàng (Tần)'},
        {color:0xdc2626, label:'Chu Nguyên Chương (Minh)'}, {color:0xa855f7, label:'Lưu Triệt (Hán Vũ)'},
        {color:0x16a34a, label:'Tào Tháo (Ngụy)'}, {color:0x22c55e, label:'Lưu Bị (Thục)'},
        {color:0xf97316, label:'Tôn Quyền (Ngô)'}, {color:0x888888, label:'Trung lập'},
        {color:0xd4a843, label:'Đô thành / Quan ải'}, {color:0x5a8ab0, label:'Sông'},
        {color:0x8a7050, label:'Đường chính'}, {color:0x7a6a5a, label:'Đường phụ'},
        {color:0x6b5b4a, label:'Dãy núi'}, {color:0x5a4a3a, label:'Núi / đồi'},
      ].map(l => `<div class="legendItem"><div class="legendColor" style="background:#${l.color.toString(16).padStart(6,'0')}"></div><span style="font-size:0.65rem;color:var(--text-dim)">${l.label}</span></div>`).join('');
    }

    // ============================================
    // CONTROLS
    // ============================================
    document.getElementById('speedSlider').addEventListener('input', (e) => { simSpeed = parseFloat(e.target.value); });
    document.getElementById('pauseBtn').addEventListener('click', () => { paused = !paused; document.getElementById('pauseBtn').textContent = paused ? '▶ Tiếp tục' : '⏸ Tạm dừng'; });
    document.getElementById('resetBtn').addEventListener('click', () => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'RESET', seed: Math.floor(Math.random()*1000000) })); });

    // Zoom controls
    let zoomLevel = 1.0;
    const updateZoomDisplay = () => { document.getElementById('zoomLevel').textContent = Math.round(zoomLevel * 100) + '%'; };
    const zoomCamera = (distanceFactor) => {
      const offset = camera.position.clone().sub(controls.target);
      const distance = THREE.MathUtils.clamp(
        offset.length() * distanceFactor,
        controls.minDistance,
        controls.maxDistance
      );
      camera.position.copy(controls.target).add(offset.setLength(distance));
      controls.update();
    };
    document.getElementById('zoomInBtn').addEventListener('click', () => {
      zoomLevel = Math.min(3.0, zoomLevel * 1.2);
      zoomCamera(1 / 1.2);
      updateZoomDisplay();
    });
    document.getElementById('zoomOutBtn').addEventListener('click', () => {
      zoomLevel = Math.max(0.3, zoomLevel / 1.2);
      zoomCamera(1.2);
      updateZoomDisplay();
    });

    // Smooth mouse wheel zoom (handled by OrbitControls automatically)

    // Theme toggle
    const themeBtn = document.getElementById('themeBtn');
    let isLight = true;
    document.documentElement.setAttribute('data-theme', 'light');
    const darkColors = { bg: 0x071524, canvas: 0x071524, ground: 0x172337, ocean: 0x123456, province: 0x223d2c, lines: 0x6b7a64, fog: 0x071524 };
    const lightColors = { bg: 0xefe4c8, canvas: 0xf3ead2, ground: 0xefe4c8, ocean: 0x7fa8b0, province: 0x86b951, lines: 0xc6a46b, fog: 0xe7dac2 };
    themeBtn.addEventListener('click', () => {
      isLight = !isLight;
      document.documentElement.setAttribute('data-theme', isLight ? 'light' : '');
      themeBtn.textContent = isLight ? '🌙' : '☀️';
      const c = isLight ? lightColors : darkColors;
      scene.background = new THREE.Color(c.canvas);
      renderer.setClearColor(c.canvas);
      scene.fog = new THREE.FogExp2(c.fog, isLight ? 0.0024 : 0.0021);
      ocean.material.color.setHex(c.ocean);
      Object.values(provinceMeshes).forEach((mesh, i) => { const prov = PROVINCES[i]; const tc = terrainColors[prov?.terrain] || terrainColors.plains; mesh.material.color.set(isLight ? new THREE.Color(tc).multiplyScalar(1.05) : new THREE.Color(tc).multiplyScalar(0.68)); });
      lineGroup.children.forEach(line => {
        line.material.color.setHex(c.lines);
        line.material.opacity = isLight ? 0.0 : 0.06;
      });
      coastLine.material.color.setHex(isLight ? 0x3a6a8a : 0x3a6a8a);
      coastLine.material.opacity = isLight ? 0.06 : 0.14;
      riverGroup.children.forEach(river => { if (river.material) river.material.opacity = isLight ? 0.68 : 0.55; });
      roadGroup.children.forEach(road => {
        if (!road.material) return;
        const isMajorRoad = road.userData?.roadType === 'major';
        const isFillLayer = road.userData?.roadLayer === 'fill';
        road.material.opacity = isLight
          ? (isFillLayer ? (isMajorRoad ? 0.88 : 0.58) : (isMajorRoad ? 0.34 : 0.22))
          : (isFillLayer ? (isMajorRoad ? 0.62 : 0.36) : (isMajorRoad ? 0.26 : 0.16));
      });
      mountainGroup.children.forEach(mtn => {
        if (!mtn.material) return;
        if (!mtn.material.userData.baseColor) mtn.material.userData.baseColor = mtn.material.color.clone();
        mtn.material.color.copy(mtn.material.userData.baseColor).multiplyScalar(isLight ? 1.08 : 0.78);
      });
      // Update terrain fog uniforms
      terrainUniforms.uFogColor.value.setHex(c.fog);
      terrainUniforms.uFogNear.value = isLight ? 170.0 : 130.0;
      terrainUniforms.uFogFar.value = isLight ? 760.0 : 620.0;
      terrainMesh.material.needsUpdate = true;
    });

    // Raycast for clicking
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    canvas.addEventListener('click', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1; mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      
      // Armies
      const armyObjects = []; Object.values(armyGroups).forEach(g => g.traverse(o => { if (o.isMesh) armyObjects.push(o); }));
      const hits = raycaster.intersectObjects(armyObjects, true);
      if (hits.length > 0) { let obj = hits[0].object; while (obj.parent && !obj.userData.factionId) obj = obj.parent; if (obj.userData.factionId) { selectFaction(obj.userData.factionId); return; } }
      
      // Citadels
      const citadelObjects = []; Object.values(citadelMeshes).forEach(m => m.group.traverse(o => { if (o.isMesh) citadelObjects.push(o); }));
      const citHits = raycaster.intersectObjects(citadelObjects, true);
      if (citHits.length > 0) {
        let obj = citHits[0].object;
        while (obj.parent && !obj.userData.citadel) obj = obj.parent;
        if (obj.userData?.citadel) {
          const cit = obj.userData.citadel;
          const owner = cit.owner;
          if (owner && factionEntities[owner]?.alive) selectFaction(owner);
        }
      }
      
      // Provinces
      const provHits = raycaster.intersectObjects(Object.values(provinceMeshes));
      if (provHits.length > 0) { const provId = provHits[0].object.userData.provinceId; const owner = PROVINCES.find(p => p.id === provId)?.owner; if (owner && factionEntities[owner]?.alive) selectFaction(owner); }
    });


    // ============================================
    // DISTANCE-BASED LABEL VISIBILITY SYSTEM
    // ============================================
    const labelVisibility = {
      // Priority tiers: higher = always visible at greater distances
      tiers: {
        capital: { maxDist: 900, minOpacity: 0.9, fadeRange: 200 },      // Capitals always visible
        city: { maxDist: 600, minOpacity: 0.7, fadeRange: 150 },         // Major cities
        province: { maxDist: 350, minOpacity: 0.5, fadeRange: 100 },     // Province labels
        mountain: { maxDist: 500, minOpacity: 0.6, fadeRange: 150 },     // Mountain ranges
        river: { maxDist: 400, minOpacity: 0.5, fadeRange: 120 },        // Rivers
        road: { maxDist: 300, minOpacity: 0.4, fadeRange: 100 },         // Roads
        pass: { maxDist: 400, minOpacity: 0.7, fadeRange: 100 },         // Strategic passes
        army: { maxDist: 350, minOpacity: 0.8, fadeRange: 100 },         // Army/faction labels
        citadel: { maxDist: 500, minOpacity: 0.8, fadeRange: 150 },      // Citadel labels
      },
      
      // Label registry: { element, position, tier, baseOpacity }
      registry: [],
      
      register(label, position, tier, baseOpacity = 1.0) {
        if (!this.tiers[tier]) tier = 'province';
        this.registry.push({
          element: label,
          position: new THREE.Vector3(...position),
          tier,
          baseOpacity: baseOpacity || 1.0,
          visible: true
        });
      },
      
      update(camera) {
        const camPos = camera.position;
        for (const item of this.registry) {
          const dist = camPos.distanceTo(item.position);
          const config = this.tiers[item.tier];
          
          if (dist > config.maxDist) {
            // Beyond max distance - hide
            if (item.visible) {
              item.element.element.style.opacity = '0';
              item.element.element.style.pointerEvents = 'none';
              item.visible = false;
            }
          } else if (dist > config.maxDist - config.fadeRange) {
            // In fade range - smooth fade
            const t = (config.maxDist - dist) / config.fadeRange;
            const opacity = Math.max(0, Math.min(1, item.baseOpacity * config.minOpacity * t));
            item.element.element.style.opacity = opacity.toFixed(3);
            item.element.element.style.pointerEvents = opacity > 0.1 ? 'auto' : 'none';
            item.visible = opacity > 0.01;
          } else {
            // Within clear range - full visibility
            if (!item.visible || parseFloat(item.element.element.style.opacity) < item.baseOpacity * config.minOpacity) {
              item.element.element.style.opacity = (item.baseOpacity * config.minOpacity).toFixed(3);
              item.element.element.style.pointerEvents = 'auto';
              item.visible = true;
            }
          }
        }
      }
    };

    // Register all existing labels
    // Province labels
    Object.entries(provinceLabels).forEach(([id, label]) => {
      const prov = PROVINCES.find(p => p.id === id);
      if (prov) {
        const tier = prov.terrain === 'capital' ? 'capital' : 'province';
        labelVisibility.register(label, [prov.pos[0] * MAP_SCALE, 0.6, prov.pos[1] * MAP_SCALE], tier);
      }
    });

    // Citadel labels
    Object.values(citadelMeshes).forEach(m => {
      const cit = m.cit;
      const tier = cit.type === 'capital' ? 'capital' : 'city';
      // Find the label by searching scene children
      const labelObj = Array.from(scene.children).find(c => 
        c.isCSS2DObject && c.position.x === cit.pos[0] * MAP_SCALE && 
        c.position.z === cit.pos[1] * MAP_SCALE &&
        c.element.textContent === cit.name
      );
      if (labelObj) {
        labelVisibility.register(labelObj, [cit.pos[0] * MAP_SCALE, cit.type === 'capital' ? 18.0 : 12.0, cit.pos[1] * MAP_SCALE], tier);
      }
    });

    // Mountain labels
    scene.children.forEach(obj => {
      if (obj.isCSS2DObject && obj.element.style.fontSize === '9px' && obj.element.style.fontWeight === '500') {
        // Likely a mountain label
        const mountainNames = MOUNTAINS.map(m => m.name);
        if (mountainNames.some(n => obj.element.textContent.includes(n))) {
          labelVisibility.register(obj, [obj.position.x, obj.position.y, obj.position.z], 'mountain');
        }
      }
    });

    // River labels
    scene.children.forEach(obj => {
      if (obj.isCSS2DObject && obj.element.style.fontStyle === 'italic' && obj.element.style.color.includes('7a9ab0')) {
        labelVisibility.register(obj, [obj.position.x, obj.position.y, obj.position.z], 'river');
      }
    });

    // Road labels
    scene.children.forEach(obj => {
      if (obj.isCSS2DObject && obj.element.style.fontStyle === 'italic' && obj.element.style.color.includes('6f4d2c')) {
        labelVisibility.register(obj, [obj.position.x, obj.position.y, obj.position.z], 'road');
      }
    });

    // Pass labels
    scene.children.forEach(obj => {
      if (obj.isCSS2DObject && obj.element.style.color.includes('d4a843') && obj.element.style.fontSize === '10px') {
        labelVisibility.register(obj, [obj.position.x, obj.position.y, obj.position.z], 'pass');
      }
    });

    // Army/Faction labels
    Object.values(armyGroups).forEach(group => {
      group.traverse(obj => {
        if (obj.isCSS2DObject && obj.element.style.fontSize === '13px') {
          labelVisibility.register(obj, [obj.position.x, obj.position.y, obj.position.z], 'army');
        }
      });
    });

    // ============================================
    // ANIMATION LOOP
    // ============================================
    const clock = new THREE.Clock();
    let lastTickTime = 0;
    const armyAnimations = new Map();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      
      // Update camera uniform for fog
      terrainUniforms.uCameraPos.value.copy(camera.position);
      
      // Update label visibility based on camera distance
      labelVisibility.update(camera);
      
      controls.update();

      // Flag waving
            Object.values(armyGroups).forEach(group => group.traverse(obj => { if (obj.userData.isFlag) { obj.rotation.z = Math.sin(Date.now() * 0.002 + obj.position.x) * 0.15; obj.position.x = 0.7 + Math.sin(Date.now() * 0.003) * 0.1; } }));
            Object.values(citadelMeshes).forEach(m => m.group.traverse(obj => { if (obj.userData.isFlag) { obj.rotation.z = Math.sin(Date.now() * 0.002 + obj.position.x) * 0.1; } }));

      // Particles
      for (let i = particleSystems.length - 1; i >= 0; i--) {
        const sys = particleSystems[i];
        sys.userData.age += delta;
        if (sys.userData.age >= sys.userData.maxAge) { scene.remove(sys); sys.geometry.dispose(); sys.material.dispose(); particleSystems.splice(i, 1); continue; }
        if (sys.geometry.attributes.velocity) {
          const pos = sys.geometry.attributes.position.array, vel = sys.geometry.attributes.velocity.array, life = sys.geometry.attributes.life.array;
          for (let j = 0; j < pos.length / 3; j++) { pos[j*3] += vel[j*3] * delta; pos[j*3+1] += vel[j*3+1] * delta; pos[j*3+2] += vel[j*3+2] * delta; vel[j*3+1] -= 9.8 * delta; life[j] -= delta / sys.userData.maxAge; }
          sys.geometry.attributes.position.needsUpdate = true; sys.geometry.attributes.life.needsUpdate = true;
          sys.material.opacity = 0.9 * (1 - sys.userData.age / sys.userData.maxAge);
        }
        if (sys.userData.type === 'trail') sys.material.opacity = 0.7 * (1 - sys.userData.age / sys.userData.maxAge);
      }

      // Army movement animations
      armyAnimations.forEach((anim, id) => {
        anim.progress += delta * 0.5 * simSpeed;
        if (anim.progress >= 1) {
          const group = armyGroups[anim.factionId];
          if (group) { const army = group.getObjectByProperty('userData.armyId', id); if (army) { const toProv = PROVINCES.find(p => p.id === anim.to); if (toProv) army.position.set(toProv.pos[0]*MAP_SCALE + (Math.random()-0.5)*3, 0, toProv.pos[1]*MAP_SCALE + (Math.random()-0.5)*3); } }
          armyAnimations.delete(id);
        } else {
          const fromProv = PROVINCES.find(p => p.id === anim.from);
          const toProv = PROVINCES.find(p => p.id === anim.to);
          if (fromProv && toProv) {
            const group = armyGroups[anim.factionId];
            if (group) { const army = group.getObjectByProperty('userData.armyId', id); if (army) { const x = THREE.MathUtils.lerp(fromProv.pos[0]*MAP_SCALE, toProv.pos[0]*MAP_SCALE, anim.progress); const z = THREE.MathUtils.lerp(fromProv.pos[1]*MAP_SCALE, toProv.pos[1]*MAP_SCALE, anim.progress); const y = Math.sin(anim.progress * Math.PI) * 2.0; army.position.set(x + (Math.random()-0.5)*0.3, y, z + (Math.random()-0.5)*0.3); } }
          }
        }
      });

      if (!paused) {
        const now = Date.now();
        if (now - lastTickTime > TICK_DURATION / simSpeed) { lastTickTime = now; tick++; updateTimeDisplay(); if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'TICK' })); }
      }

      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }

    window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); labelRenderer.setSize(window.innerWidth, window.innerHeight); });

    renderLegend(); renderFactionList(); connectWS(); animate();
  </script>
</body>
</html>
